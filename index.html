  // Las páginas que vivían en bothventures.github.io/stack/pages/… se mudaron.
  // Lo público, a p.both.ventures; todo lo demás, a la zona del equipo (con login).
  (function () {
    var PUBLIC = ["venture/photonic-labs-institutional-v03", "direction/bienal-punta-hyper-neo-class"];
    var rest = location.pathname.replace(/^\/stack(\/pages)?\/?/, "");
    var pub = PUBLIC.some(function (s) { return rest === s || rest.indexOf(s + "/") === 0; });
    var base = pub ? "https://both-public.pages.dev/" : "https://both-internal.pages.dev/";
    location.replace(base + rest + location.search + location.hash);
  })();
</script>
