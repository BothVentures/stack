<meta name="description" content="Brand guidelines V0.3.0 «Máscaras» — Bienal Blockchain Punta 2027. Sistema operable: reglas, tokens y chequeos. Cada regla es un token, un chequeo binario o un juicio humano nombrado. Rev. 2026-08-27: paleta editorial scopeada, la marca de dunas, el pie como directorio, flip, dos lenguas.">
<style>
/* ===========================================================================
   Bienal Blockchain Punta — tokens del sistema V0.3.0 "Máscaras"
   ---------------------------------------------------------------------------
   UNA hoja de tokens. Antes los valores vivían en cuatro representaciones sin
   ningún vínculo: hex en CSS, vec3 en GLSL, strings en JS y rgba() inline. Y
   dos azules distintos se llamaban los dos "sky" (#7FC3EE en el hero,
   #1E8FE0 en la hoja). Se reconcilian acá.

   El companion CSS publicado vive en templates/themes/bienal-punta.css y se
   genera de este archivo — es el hook de propagación de dirección de arte.
   =========================================================================== */
:root{
  /* --- tintas: DOS, más la fotografía como único tono medio -------------- */
  --acid:    #C8F52D;   /* ink 01 — campo dominante. Nunca acento suelto */
  --void:    #12140F;   /* ink 02 — casi negro con sesgo verde */
  --acid-d:  #A5CE1E;   /* ácido oscurecido — sólo estados :active */
  --quiet:   #1D2016;   /* tercer VALOR, no tercera tinta: masa negra sobre
                           negro, legible sólo como textura (etherfuse) */
  --paper:   #F4F1E8;   /* modo fondo claro — print y papelería */
  --sky-mid: #7FC3EE;   /* el tono medio propio del cielo, nunca un gris */

  /* --- tipografía: cuatro familias, cada una con su trabajo -------------- */
  --disp:  "Archivo", "Helvetica Neue", Arial, sans-serif;
  --pixel: "Handjet", "Archivo", monospace;          /* slots FIJOS del nombre */
  --tema:  "Instrument Serif", Georgia, serif;       /* slot VARIABLE del nombre */
  --mono:  "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  /* escala display — las tres voces del nombre, en el orden del canon:
     BIENAL (pixel) · Blockchain (serif itálica, slot variable) · PUNTA 2027
     (pixel). Topes bajados respecto de VB0.1-B (258 px) porque acá el bloque
     conviven con eyebrow, pie y una segunda columna: a 258 px el nombre se
     salía del primer viewport. */
  --t-formato: clamp(30px, 6.6vw, 92px);
  --t-tema:    clamp(46px, 10.4vw, 158px);
  --t-lugar:   clamp(38px, 8.2vw, 118px);
  /* escala general */
  --t-display: clamp(1.9rem, 5.4vw, 4.9rem);
  --t-h2:      clamp(1.05rem, 2vw, 1.5rem);
  --t-sub:     clamp(1rem, 1.9vw, 1.35rem);
  --t-lead:    clamp(.95rem, 1.55vw, 1.22rem);
  --t-body:    .93rem;
  --t-mono:    .74rem;
  --t-lbl:     clamp(.58rem, .95vw, .68rem);
  --t-micro:   .6rem;

  /* --- ritmo -------------------------------------------------------------- */
  --pad:   clamp(1rem, 2.8vw, 2.2rem);
  --sheet: 1180px;
  --hair:  1px;
  --rule:  1px solid rgba(18, 20, 15, .26);

  /* --- curvas nombradas: TF3 pedía beziers, no palabras clave ------------- */
  --ease-out:  cubic-bezier(.22, .61, .36, 1);
  --ease-step: cubic-bezier(.85, 0, .15, 1);   /* para lo que debe leerse duro */
  --ease-in:   cubic-bezier(.55, .06, .68, .19);
}

/* El radio del sistema es cero. No es una preferencia, es la regla No-05. */
*, *::before, *::after{ border-radius: 0; }


*{ box-sizing: border-box; }
body{
  margin: 0; background: var(--acid); color: var(--void);
  font-family: var(--disp); font-weight: 600;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
.sheet{ max-width: var(--sheet); margin: 0 auto; padding: var(--pad); }

/* ---------- portada ---------- */
.masthead{ position: relative; min-height: clamp(340px, 46vw, 560px); overflow: hidden; }
.masthead canvas{ position: absolute; inset: 0; width: 100%; height: 100%; }
.masthead .inner{ position: relative; width: fit-content; max-width: 100%;
                  padding: clamp(1rem,2.4vw,1.8rem) clamp(1.1rem,2.6vw,2rem); }
/* la marca de dunas encabeza el documento — inline, currentColor, como en la barra */
.masthead .mark{ display: block; height: clamp(1.6rem, 3.4vw, 2.4rem); width: auto; margin-bottom: .8rem; }
.masthead .mark svg{ display: block; height: 100%; width: auto; }
.lbl{ font-family: var(--mono); font-size: var(--t-micro); font-weight: 600;
      letter-spacing: .17em; text-transform: uppercase; }
.masthead h1{ margin: .5rem 0 0; line-height: .86; text-transform: uppercase; }
.masthead h1 .a{ display: block; font-family: var(--pixel); font-weight: 800;
                 font-size: clamp(38px, 8.4vw, 116px); letter-spacing: .03em; }
.masthead h1 .b{ display: block; font-family: var(--tema); font-style: italic;
                 font-weight: 400; text-transform: none;
                 font-size: clamp(40px, 9.2vw, 128px); line-height: .9; margin-top: -.05em; }
.masthead .sub{ margin: .9rem 0 0; font-size: var(--t-sub); font-weight: 600; max-width: 40ch; }

/* ---------- nav de anclas ---------- */
.jump{ border-top: 2px solid var(--void); border-bottom: 2px solid var(--void);
       padding: .8rem 0; margin: clamp(1.6rem,4vw,2.6rem) 0; }
.jump ul{ list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .35rem .9rem; }
.jump a{ font-family: var(--mono); font-size: var(--t-micro); font-weight: 600;
         letter-spacing: .1em; text-transform: uppercase; color: var(--void); text-decoration: none; }
.jump a:hover{ text-decoration: underline; text-underline-offset: 3px; }
.jump .n{ opacity: .5; margin-right: .35em; font-variant-numeric: tabular-nums; }

/* ---------- secciones ---------- */
section{ margin: 0 0 clamp(2.6rem, 6vw, 5rem); scroll-margin-top: 1rem; }
/* La cabecera habla la gramática del lockup, igual que la landing: el ordinal
   en la cara de píxeles —la de los slots fijos del nombre— y una palabra del
   titular en la serif itálica, la del slot variable. No es decoración: cada
   sección repite el reparto de voces del nombre. */
.head{ display: flex; align-items: baseline; gap: 1rem;
       border-top: 2px solid var(--void); padding-top: .5rem; margin-bottom: clamp(1rem,2.4vw,1.6rem); }
.head h2{ margin: 0; font-size: var(--t-h2); font-weight: 900; letter-spacing: -.02em;
          text-transform: uppercase; line-height: 1; }
.head h2 em{ font-family: var(--tema); font-style: italic; font-weight: 400;
             text-transform: none; letter-spacing: -.01em; font-size: 1.34em; line-height: .9; }
.head .num{ margin-left: auto; font-family: var(--pixel); font-weight: 800;
            font-size: clamp(1.15rem, 2.4vw, 1.75rem); letter-spacing: .05em; line-height: 1;
            font-variant-numeric: tabular-nums; }
.body{ margin: 0 0 1rem; font-size: var(--t-body); line-height: 1.52; font-weight: 500; max-width: 62ch; }
.mono-body{ font-family: var(--mono); font-size: var(--t-mono); line-height: 1.6; max-width: 68ch; margin: 0 0 1rem; }
blockquote{ margin: 1rem 0; padding: .7rem 0 .7rem 1rem; border-left: 3px solid var(--void);
            font-size: var(--t-sub); font-weight: 600; max-width: 52ch; }
h3.sub-h{ font-family: var(--mono); font-size: .62rem; font-weight: 600; letter-spacing: .16em;
          text-transform: uppercase; margin: 1.8rem 0 .2rem; }

/* ---------- la regla de tres vías: cada regla lleva su clase ---------- */
.rules{ display: grid; gap: 1px; background: var(--void); border: 2px solid var(--void); margin: 1.2rem 0; }
.rule{ background: var(--acid); padding: .8rem .95rem; display: grid;
       grid-template-columns: 5.4rem 1fr; gap: .5rem 1rem; align-items: start; }
@media (max-width: 640px){ .rule{ grid-template-columns: 1fr; } }
.rule .cls{ font-family: var(--mono); font-size: .54rem; font-weight: 600; letter-spacing: .1em;
            text-transform: uppercase; padding: .3em .45em; text-align: center; align-self: start; }
.cls-a{ background: var(--void); color: var(--acid); }              /* token */
.cls-b{ background: var(--void); color: var(--acid); outline: 2px solid var(--void); outline-offset: -5px; }
.cls-c{ background: transparent; color: var(--void); border: var(--hair) solid var(--void); }
.rule .txt{ font-size: .84rem; font-weight: 500; line-height: 1.45; }
.rule .txt b{ font-weight: 900; }
.rule code{ font-family: var(--mono); font-size: .78em; background: rgba(18,20,15,.1); padding: .1em .3em; }
.rule .who{ display: block; font-family: var(--mono); font-size: .56rem; letter-spacing: .1em;
            text-transform: uppercase; opacity: .68; margin-top: .35em; }

/* ---------- do / don't ---------- */
.dd{ display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1px;
     background: var(--void); border: 2px solid var(--void); margin: 1.2rem 0; }
.dd > div{ padding: .85rem .95rem; }
.dd .si{ background: var(--acid); color: var(--void); }
.dd .no{ background: var(--void); color: var(--acid); }
.dd h4{ margin: 0 0 .4rem; font-family: var(--mono); font-size: .58rem; font-weight: 600;
        letter-spacing: .16em; text-transform: uppercase; }
.dd ul{ margin: 0; padding-left: 1.05rem; }
.dd li{ font-size: .8rem; font-weight: 500; line-height: 1.42; margin-bottom: .4rem; }

/* ---------- tablas de tokens ---------- */
table.tk{ width: 100%; border-collapse: collapse; margin: 1.1rem 0; }
table.tk th{ text-align: left; font-family: var(--mono); font-size: .56rem; font-weight: 600;
             letter-spacing: .14em; text-transform: uppercase; padding: .4rem .5rem;
             border-bottom: 2px solid var(--void); }
table.tk td{ padding: .52rem .5rem; border-bottom: var(--rule); font-size: .78rem; font-weight: 500;
             vertical-align: baseline; }
table.tk td.m{ font-family: var(--mono); font-size: .72rem; }
.sw{ display: inline-block; width: 1.05em; height: 1.05em; vertical-align: -.16em;
     margin-right: .45em; border: var(--hair) solid var(--void); }

/* ---------- demos vivos ---------- */
.demos{ display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: clamp(.6rem,1.6vw,1rem); margin: 1.2rem 0; }
.demo .frame{ position: relative; aspect-ratio: 4 / 3; background: var(--void); overflow: hidden; }
.demo .frame canvas{ position: absolute; inset: 0; width: 100%; height: 100%; }
.demo .anchor{ position: absolute; left: 16%; top: 34%; width: 56%; height: 30%; }
.demo .cap{ font-family: var(--mono); font-size: .56rem; letter-spacing: .1em;
            text-transform: uppercase; margin-top: .45rem; line-height: 1.4; }
.demo .cap b{ font-weight: 600; }

/* ---------- demos de tratamiento de imagen ----------
   Las guidelines legislaban el tratamiento fotográfico sin mostrar una sola
   imagen. Un manual que dice «entra recortada a la máscara» y no lo enseña no
   se puede aplicar: cada quien imagina otra cosa. Cinco demos: cuatro
   tratamientos permitidos —el cuarto es la excepción anotada del desenfoque—
   y el contraejemplo. */
.imgdemos{ display: grid; grid-template-columns: repeat(auto-fit, minmax(258px, 1fr));
           gap: clamp(.7rem, 1.8vw, 1.2rem); margin: 1.3rem 0; }
.imgdemo figure{ margin: 0; }
.imgdemo .fr{ position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--void); }
.imgdemo canvas{ position: absolute; inset: 0; width: 100%; height: 100%; }
.imgdemo .bleed{ position: absolute; inset: 0; background-size: cover; background-position: center; }
/* la caja que el motor MIDE para generar la masa. No se ve: define la huella.
   Tiene que ser hija del contenedor del canvas — `readRects` busca el selector
   dentro de `canvas.parentElement`, así que apuntarlo al propio contenedor
   devuelve cero cajas y la máscara sale vacía. */
.imgdemo .key{ display: block; }
/* la retícula de celda sobre el fondo a sangre — la MISMA que usa el sitio */
.imgdemo .bleed.grid::after{
  content: ""; position: absolute; inset: 0; opacity: .16;
  background-image: linear-gradient(to right,  var(--void) var(--hair), transparent var(--hair)),
                    linear-gradient(to bottom, var(--void) var(--hair), transparent var(--hair));
  background-size: var(--cell, 30px) var(--cell, 30px);
}
/* la excepción del desenfoque, tal como corre en §04 de la landing: la capa
   con `inset` negativo porque el blur samplea más allá del borde — sin el
   margen extra deja una viñeta clara en los cuatro cantos. */
.imgdemo .bleed.blur{ inset: -8%; filter: blur(14px); }
.imgdemo .fr .plate-demo{
  position: absolute; left: 12%; top: 26%; width: 62%; padding: .7rem .8rem;
  background: var(--acid); color: var(--void);
  font-size: .74rem; font-weight: 900; letter-spacing: -.01em; line-height: 1.15;
}
.imgdemo .tag{
  position: absolute; left: 0; top: 0; z-index: 2;
  font-family: var(--mono); font-size: .5rem; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; padding: .3rem .5rem;
  background: var(--acid); color: var(--void);
}
.imgdemo--no .tag{ background: var(--void); color: var(--acid); box-shadow: 0 0 0 2px var(--acid); }
.imgdemo figcaption{
  font-family: var(--mono); font-size: .56rem; letter-spacing: .1em;
  text-transform: uppercase; margin-top: .5rem; line-height: 1.45;
}
.imgdemo figcaption b{ font-weight: 600; }

/* ---------- la paleta editorial: demos scopeados --------------------------
   Los cuatro valores se declaran ACÁ y no en :root, a propósito: la regla es
   que la paleta vive scopeada en sus tres consumidores y no se filtra al
   resto del sistema. Este contenedor es el cuarto consumidor sancionado — el
   manual que la documenta. */
.edpal{
  --c-peri: #969DDA; --c-tan: #C6AB7E; --c-red: #E8503F; --c-sage: #9FB185;
  --app-bg: #F2EDE4; --app-ink: #12140F;
}
/* la plancha de ficha, como en §04 de la landing: canvas que lee --card y
   desborda --room por los cuatro lados para que ninguna celda muera al ras */
.edcards{ display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
          gap: 14px; margin: 1.2rem 0; overflow: visible; }
.edcard{ position: relative; --card: var(--c-sage); --bite: 20px; --room: 14px;
         min-height: 150px; color: var(--app-ink); }
.edcard > canvas{ position: absolute; inset: calc(var(--room) * -1); z-index: 0;
                  width: calc(100% + var(--room) * 2); height: calc(100% + var(--room) * 2); }
.edcard .dc-src{ position: absolute; inset: var(--bite); pointer-events: none; }
.edcard .in{ position: relative; z-index: 2; padding: 24px 24px 22px;
             display: flex; flex-direction: column; height: 100%; }
.edcard--peri{ --card: var(--c-peri); }
.edcard--tan { --card: var(--c-tan);  }
.edcard--red { --card: var(--c-red);  }
.edcard--ink { --card: var(--app-ink); color: var(--app-bg); }
.edcard .u{ font-weight: 600; font-size: .64rem; opacity: .9; }
.edcard .v{ font-weight: 900; font-size: clamp(1.9rem, 4vw, 2.8rem); line-height: .86;
            letter-spacing: -.03em; margin: 12px 0 8px; font-variant-numeric: tabular-nums; }
.edcard .t{ font-weight: 600; font-size: .72rem; line-height: 1.28; max-width: 26ch; }
.edcard .mock{ align-self: flex-start; margin-top: .6rem; padding: 6px 10px 5px;
               background: var(--app-ink); color: var(--app-bg);
               font-weight: 700; font-size: .54rem; letter-spacing: .04em; }
.edcard--ink .mock{ background: var(--app-bg); color: var(--app-ink); }
/* el difuminado de esquinas — la misma paleta en su registro más callado.
   Gradientes de dos capas por esquina, NO filter:blur — el filtro sangra por
   los bordes y cuesta una capa de composición por scroll. */
.edcorners{
  position: relative; min-height: clamp(220px, 26vw, 300px); margin: 1.2rem 0;
  background: #FFFFFF; border: 2px solid var(--void); overflow: hidden;
}
.edcorners::before{
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(62% 66% at 0% 0%,
      color-mix(in srgb, var(--c-peri) 60%, transparent) 0%,
      color-mix(in srgb, var(--c-peri) 22%, transparent) 38%, transparent 74%),
    radial-gradient(26% 30% at 2% 0%,
      color-mix(in srgb, var(--c-peri) 46%, transparent) 0%, transparent 100%),
    radial-gradient(58% 62% at 100% 0%,
      color-mix(in srgb, var(--c-tan) 58%, transparent) 0%,
      color-mix(in srgb, var(--c-tan) 20%, transparent) 40%, transparent 76%),
    radial-gradient(24% 26% at 100% 4%,
      color-mix(in srgb, var(--c-tan) 44%, transparent) 0%, transparent 100%),
    radial-gradient(60% 58% at 0% 100%,
      color-mix(in srgb, var(--c-sage) 58%, transparent) 0%,
      color-mix(in srgb, var(--c-sage) 20%, transparent) 40%, transparent 76%),
    radial-gradient(26% 24% at 4% 100%,
      color-mix(in srgb, var(--c-sage) 42%, transparent) 0%, transparent 100%),
    radial-gradient(48% 50% at 100% 100%,
      color-mix(in srgb, var(--c-red) 38%, transparent) 0%,
      color-mix(in srgb, var(--c-red) 13%, transparent) 40%, transparent 74%),
    radial-gradient(20% 20% at 100% 100%,
      color-mix(in srgb, var(--c-red) 30%, transparent) 0%, transparent 100%);
}
.edcorners .ficha{
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: var(--acid); color: var(--void); border: 2px solid var(--void);
  padding: .9rem 1.1rem; max-width: 34ch;
  font-size: .78rem; font-weight: 600; line-height: 1.4;
}

/* ---------- la marca de dunas: las dos emisiones -------------------------- */
.marks2{ display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
         gap: clamp(.7rem,1.8vw,1.2rem); margin: 1.2rem 0; }
.mark-demo .fr{ background: var(--void); color: var(--acid);
                padding: clamp(1.4rem,3vw,2.2rem); display: grid; place-items: center; }
.mark-demo .fr svg{ display: block; width: min(60%, 190px); height: auto; }
.mark-demo figcaption{ font-family: var(--mono); font-size: .56rem; letter-spacing: .1em;
                       text-transform: uppercase; margin-top: .5rem; line-height: 1.45; }
.mark-demo figure{ margin: 0; }

/* ---------- merchandising: la bolsa, como mockup ----------
   Es la aplicación que finalmente ejercita el MODO FONDO CLARO, que el sistema
   declaraba y ninguna pieza usaba.

   Antes acá había sólo el ARTE plano, en un rectángulo, con el argumento de que
   un mockup «se pretendería más terminado de lo que está». El argumento estaba
   mal: sin la forma del objeto no se ve que el arte funcione EN una bolsa —
   dónde cae respecto de las asas, cuánto se pierde en la costura, si la masa
   sobrevive al formato. El mockup es dibujado, no fotográfico: la lona, las asas
   y el pliegue son vector, así que no finge una foto de producto que no existe.

   Las asas van en SVG y no en border-radius: el radio del sistema es cero y esa
   regla no admite una excepción decorativa. */
.totes{ display: grid; grid-template-columns: repeat(auto-fit, minmax(258px, 1fr));
        gap: clamp(.9rem, 2.4vw, 1.8rem); margin: 1.4rem 0;
        background: var(--void); padding: clamp(1.1rem, 3vw, 2rem);
        /* el contenedor es plancha void: las leyendas heredan la tinta
           invertida. Sin esto salían void sobre void — invisibles. */
        color: var(--acid); }
.tote figure{ margin: 0; }
.tote .bag{ position: relative; width: 100%; aspect-ratio: 34 / 46; }
.tote .handles{ position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.tote .art{
  position: absolute; left: 0; right: 0; bottom: 0; height: 82.6%;
  overflow: hidden; background: var(--paper);
}
/* pliegue de la lona: una sola tinta con alfa, no una tinta nueva */
.tote .art::after{
  content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background:
    linear-gradient(96deg, rgba(18,20,15,.10) 0%, rgba(18,20,15,0) 14%,
                           rgba(18,20,15,0) 84%, rgba(18,20,15,.13) 100%),
    linear-gradient(to bottom, rgba(18,20,15,.09) 0%, rgba(18,20,15,0) 9%);
}
.tote .rep{
  position: absolute; inset: 0; padding: 7% 5%;
  display: flex; flex-direction: column; justify-content: center; gap: .02em;
  font-family: var(--disp); font-weight: 900; color: var(--void);
  font-size: clamp(1.05rem, 4.6vw, 2.05rem); line-height: .96;
  letter-spacing: -.03em; text-transform: uppercase; white-space: nowrap;
}
.tote canvas{ position: absolute; inset: 0; width: 100%; height: 100%; }
.tote .info{
  position: absolute; left: 21%; top: 43%; width: 54%;
  font-family: var(--mono); font-weight: 600; font-size: clamp(.42rem, 1.1vw, .56rem);
  line-height: 1.5; letter-spacing: .06em;
}
.tote .info b{ display: block; font-weight: 600; }
.tote--acid .info{ color: var(--void); }     /* invertido sobre masa ácida */
.tote--void .info{ color: var(--acid); }     /* invertido sobre masa void */
.tote .marks{
  position: absolute; left: 5%; right: 5%; bottom: 4%;
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: .4rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--void); opacity: .62;
}
.tote figcaption{
  font-family: var(--mono); font-size: .56rem; letter-spacing: .1em;
  text-transform: uppercase; margin-top: .5rem; line-height: 1.45;
}

/* especimen tipográfico */
.spec{ border-bottom: var(--rule); padding: .9rem 0; display: grid;
       grid-template-columns: 9.5rem 1fr; gap: 1rem; align-items: baseline; }
@media (max-width: 700px){ .spec{ grid-template-columns: 1fr; } }
.spec .meta{ font-family: var(--mono); font-size: .56rem; letter-spacing: .1em;
             text-transform: uppercase; line-height: 1.5; }

  gap: clamp(1.6rem, 3.4vw, 2.6rem) clamp(1.1rem, 2.4vw, 2rem);

  --f-h: calc(var(--f-name) * .88 + .34rem

              + var(--t-micro) * 1.35);
  padding-top: clamp(1.6rem, 3.6vw, 2.4rem); padding-bottom: clamp(1.4rem, 3.2vw, 2.2rem);

.f-mark{ display: block; height: var(--f-h); aspect-ratio: 120 / 59.08; }
.f-mark svg{ display: block; width: 100%; height: 100%; }
.f-word{ min-width: 0; display: grid; gap: .34rem; align-content: center; }
.f-name{ margin: 0; display: flex; flex-wrap: wrap; align-items: baseline;

       padding: .42rem .5rem .48rem; display: grid; gap: .1rem; align-content: start; }

@media (max-width: 1000px){

/* ===========================================================================
   Bienal Blockchain Punta — motor de máscara
   ---------------------------------------------------------------------------
   UNA implementación del algoritmo, consumida por el hero, la hoja de sistema,
   la landing, las guidelines y el render de motion.

   Antes de esto el algoritmo existía dos veces, en dos lenguajes, y los hashes
   NO coincidían: GLSL usaba hash21 (Hoskins, fract de 3 vectores) y el canvas
   usaba sin()*43758.5453. Todas las demás constantes eran idénticas, así que el
   hero y la hoja producían grano distinto con la misma semilla mientras la hoja
   afirmaba correr "el mismo algoritmo". Se unifica en hash21.

   La regla madre: TODO se decide en el centro de la celda. Por eso el borde
   sólo puede escalonar en ángulo recto, y esa escalera es todo el lenguaje.
   =========================================================================== */
(function (root) {
  "use strict";

  /* --- ruido: paridad byte-a-byte con mask.frag.glsl --------------------- */

  /* GLSL corre float32 y JS float64. Sin fround el ruido divergía en el sexto
     decimal, y una celda de borde podía volcar — así que "el mismo algoritmo"
     no era literalmente cierto. Con fround en cada operación sí lo es, y la
     paridad se verifica en navegador (motion/parity-test.html), no se afirma. */
  const f = Math.fround;
  const fract = (x) => f(x - Math.floor(x));

  function hash21(px, py) {
    const a = fract(f(px * 0.1031));
    const b = fract(f(py * 0.1031));
    let x = a, y = b, z = a;                       // vec3(p.xyx)
    const d = f(f(f(x * f(y + 33.33)) + f(y * f(z + 33.33))) + f(z * f(x + 33.33)));
    x = f(x + d); y = f(y + d); z = f(z + d);
    return fract(f(f(x + y) * z));
  }

  function vnoise(px, py) {
    const ix = Math.floor(px), iy = Math.floor(py);
    let fx = fract(f(px)), fy = fract(f(py));
    fx = f(f(fx * fx) * f(3 - f(2 * fx)));
    fy = f(f(fy * fy) * f(3 - f(2 * fy)));
    const a = hash21(ix, iy),     b = hash21(ix + 1, iy);
    const c = hash21(ix, iy + 1), d = hash21(ix + 1, iy + 1);
    const ab = f(a + f(f(b - a) * fx));
    const cd = f(c + f(f(d - c) * fx));
    return f(ab + f(f(cd - ab) * fy));
  }

  function fbm(px, py) {
    return f(f(f(vnoise(px, py) * 0.62)
             + f(vnoise(f(f(px * 2.13) + 7.3), f(f(py * 2.13) + 7.3)) * 0.26))
             + f(vnoise(f(f(px * 4.37) + 3.1), f(f(py * 4.37) + 3.1)) * 0.12));
