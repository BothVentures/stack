  SEC.push({ id: "abierto", n: "16", t: "Abierto y en <em>disputa</em>", tt: "Abierto y en disputa", cls: "open", html: `
    <p class="body" style="max-width:66ch">Sección obligatoria. Una sección vacía en una marca joven
      es una bandera roja, no un logro. Nada de esto está resuelto, y ninguna de estas piezas está
      aprobada.</p>
    <ol>
      <li><b>Ácido o ultramar — y ahora también Máscaras o Blanco.</b> V0.3.0 «Máscaras» contra
        V0.2.0 «Grabado» siguen siendo dos mundos, no dos variantes. Y dentro de Máscaras hay dos
        horneadas de la misma página —la ácida y la Blanco (blanco + campo olivo)— hechas para
        mirarse lado a lado. René elige. Ninguna está aprobada.</li>
      <li><b>La voz.</b> El ácido es cripto-nativo y de alto voltaje. Hay que contrastarlo contra
        «institucional, no corporativo». Es la tensión más real que tiene la dirección.</li>
      <li><b>La paleta editorial rompe No-02.</b> Cuatro tintas sobre crema en el tablero de §04,
        por pedido del cliente. Está scopeada a tres consumidores, la tinta volvió a ser
        <code>--void</code> y la forma sigue siendo plancha de máscara — pero «ninguna tercera
        tinta» quedó contradicha en la propia landing. René ratifica la excepción, la promueve a
        sistema, o la veta.
        <span class="was">Regla vigente: «Ninguna tercera tinta. La inversión resuelve todas las
        jerarquías.» Excepción viva: --c-peri · --c-tan · --c-red · --c-sage sobre crema, scopeadas.</span></li>
      <li><b>La fotografía desenfocada rompe Sí-03.</b> El fondo del tablero va con blur(26px) para
        que la piedra no compita con los bordes escalonados, y el hover del programa trae la foto de
        la sala desenfocada. Anotado en las piezas y acá. Falta decidir si «desenfocada como campo»
        es un tratamiento sancionado del sistema (§05.04) o una excepción por pieza.</li>
      <li><b>La itálica se expandió de un slot a una gramática.</b> Nació atada al slot del tema.
        Hoy tiene cuatro posiciones: el slot del tema, una palabra por titular de sección, la línea
        del medio de la pila (indicación de René), y el titular entero de las fichas de audiencia.
        Cada paso se registró — pero la suma es lo que la vieja regla temía: si la itálica aparece
        cada vez que algo «quiere destacarse», deja de señalar el slot variable y pasa a ser
        decoración. René bendice la gramática expandida o la recorta.
        <span class="was">Antes: «La serif itálica aparece sólo en el slot del tema. Nunca en cuerpo,
        nunca en datos, nunca más de una vez por pieza.»<br>
        Ahora: «Nunca en cuerpo ni en datos. Acentos display con slot nombrado, registrados uno a uno.»</span></li>
      <li><b>La regla No-03, reescrita.</b> Las tres voces display entran por indicación de Mariano,
        y contradicen una regla que la hoja ya declaraba. Queda registrada para que René ratifique o
        vete sabiendo qué se cambió.
        <span class="was">Antes: «Ningún peso intermedio en display. Archivo 900 o mono.»<br>
        Ahora: «Tres voces, una por slot del nombre. Ninguna cuarta voz.»</span></li>
      <li><b>La marca de dunas es curva en un sistema de ángulo recto.</b> Por eso el generador
        emite las dos versiones —suave y escalonada— de la misma definición. La landing corre la
        suave en la barra y el pie; la escalonada no tiene consumidor. Cuál es canónica en qué
        superficie no está decidido, y la tensión con No-05/Sí-02 queda a la vista, no resuelta.</li>
      <li><b>La retícula cambió de lógica cuatro veces.</b> Papel ambiente sobre todo el sitio;
        fuera (leía como líneas clavadas sobre la foto del hero); de vuelta sobre plancha de tinta;
        y fuera del papel vacío de §03 cuando la foto se parkeó (densidad sin trabajo). La regla de
        hoy —plancha siempre, foto por decisión, papel vacío nunca, ambiente jamás— es la cuarta
        formulación. Señal de búsqueda, no de resolución.</li>
      <li><b>--c-red no tiene consumidor.</b> La única ficha bermellón del tablero pasó a salvia por
        pedido, y la paleta editorial quedó de facto en tres tintas. El token se deja definido, no
        borrado: volver a rojo es cambiar una línea; borrarlo sería tirar la decisión de color
        entera.</li>
      <li><b>La máscara se retiró de las salas del programa.</b> Desde el 2026-08-27 las cinco
        fotos de §05 van enteras, en placa rectangular, sin filete (pedido del cliente). El recorte
        a la máscara sigue siendo el tratamiento base y sigue vivo en el corredor y en las demos —
        pero acaba de perder a su consumidor más visible. Si la placa rectangular se extiende, el
        tratamiento base deja de ser base: hay que mirarlo en la próxima revisión.</li>
      <li><b>La muesca de rompecabezas está retirada, no descartada.</b> Era la firma de la
        referencia de app —dos tarjetas trabadas por una lengüeta redondeada— y sobre una plancha de
        máscara no se sostiene: delata las dos gramáticas a la vez. Rehacer el enganche en la lengua
        de la máscara (que las dos planchas se busquen y se toquen) es trabajo pendiente; las clases
        se siguen emitiendo y no pintan nada.</li>
      <li><b>El copy de los dorsos de sala es nuevo y está sin firmar.</b> Se escribió para el flip
        respetando el canon (sin aforos, sin precios, sin «Leaders Forum»). Firma René.</li>
      <li><b>§03 perdió su fotografía por pedido</b> («remove the picture for now»). Restituirla es
        devolverle un atributo a la sección — el patrón queda documentado en el template. El campo
        blanco con las esquinas difuminadas es el estado vigente, no un default del sistema.</li>
      <li><b>El cielo.</b> Es stock de Adobe (<code>360_F_261556117_…</code>). Sirve para la
        propuesta, no para producción: hace falta licencia o una toma propia de Punta. En la
        variante Blanco el cielo salió del sitio entero — y su crédito con él. La deuda queda
        fechada, no resuelta.</li>
      <li><b>Las imágenes del proyecto son renders generados</b>, no fotografías de las sedes. Se
        usan por la máscara y con la línea de crédito. Producción exige material real — y el
        retrato, además, cesión de una persona identificable.</li>
      <li><b>Modelo de acceso.</b> «Solicitar invitación» asumía que la Bienal es por invitación,
        y eso no está decidido. La landing usa un CTA neutral: lo esquiva, no lo contesta.</li>
      <li><b>La línea de pie</b> como parte no desprendible del lockup mínimo. Recomendación sí,
        respuesta pendiente de René. Ahí se resuelve la ambigüedad de «Punta» fuera de la región.</li>
      <li><b>Paridad de motores.</b> El canvas y el shader coinciden en <b>597 de 600 celdas
        (99,5 %)</b>. Las tres que difieren son de fleco y vienen de FMA en GPU, que JS no puede
        replicar. El pack usa canvas en todas las superficies, así que hoy no hay divergencia
        visible — pero la afirmación «el mismo algoritmo» tiene ese asterisco medido.</li>
      <li><b>La adenda de la prueba de decisión no se puede citar en público.</b>
        «Ni cripto ni cultura: las dos.» es la línea más filosa que tiene el proyecto y contiene
        el sustantivo «cultura», que el canon §5 prohíbe en toda pieza. La contradicción es de la
        fuente: el SOW la escribe, el canon la prohíbe. Se trata como doctrina interna —vale para
        quien diseña, no va en superficie— pero alguien tiene que decidir si la regla admite la
        excepción o si la adenda se reescribe.
        <span class="was">Lo encontró el chequeo binario, no una lectura: la línea ya estaba
        puesta en una losa a pantalla completa de la landing.</span></li>
      <li><b>El registro marcario no está presentado.</b> El conjunto distintivo a registrar es
        «Bienal Blockchain Punta»; lo registrado es «Punta Crypto», que se retiene como marca
        defensiva sin uso público. Owner: Andrés.</li>
      <li><b>La carta de Uruguay Innova está firmada bajo el nombre viejo.</b> La única salida
        sancionada es la línea de continuidad, más hacer que la confirmación pendiente nazca ya con
        el nombre nuevo.</li>
      <li><b>Los gates G1, G2 y G3 no tienen resultado registrado.</b> Todo esto es exploración
        previa a la autorización. El bloqueante vivo es la cotización real del MACA.</li>
      <li><b>El satélite del año par (2028).</b> Existencia y forma: parkeado. Ninguna pieza dice
        nada de actividad en año par.</li>
    </ol>` });

  SEC.push({ id: "descargas", n: "17", t: "Descargas y <em>handoff</em>", tt: "Descargas y handoff", html: `
    <p class="body">Los tokens no viven en prosa: viven en CSS que un agente puede cargar. Ese es
      el hook de propagación — los publishers leen el theme fresh al publicar.</p>
    <div class="dl">
      <div><div class="p">templates/themes/bienal-punta.css</div><div class="d">El theme compañero. Generado de <code>_engine/tokens.css</code>. Cargalo antes de producir cualquier pieza.</div></div>
      <div><div class="p">_engine/mask.js</div><div class="d">El motor. API declarativa por <code>data-*</code> (incluido <code>data-blob="--card"</code> para las planchas de ficha) más una API de bajo nivel (<code>grid</code>, <code>render</code>, <code>clipTo</code>) para render fuera del DOM.</div></div>
      <div><div class="p">_engine/mask.frag.glsl</div><div class="d">El mismo algoritmo en GLSL, en espacio de píxeles. <b>Ninguna pieza del pack lo consume</b> — se mantiene para el hero legacy y para el test de paridad.</div></div>
      <div><div class="p">_engine/content.js</div><div class="d">El copy canónico, con su capa <code>en</code>. Ninguna pieza vuelve a escribir el lockup, la agenda ni las salas a mano.</div></div>

  const loaded = new Map();

  function paintImgCanvas(cv) {
    const img = loaded.get(cv.dataset.img);
    if (!img) return;
    const d = Mask.dpr();
    Mask.sizeFor(cv);
    const g = cv.getContext("2d");
    const cell = (+cv.dataset.cell || 12) * d;
    g.clearRect(0, 0, cv.width, cv.height);
    const gr = cv.__grid;
    if (!gr) return;
    g.save();
    Mask.clipTo(g, gr);
    /* color pleno y sin filtro — regla Sí-03 de esta misma sección */
    const zoom = +cv.dataset.zoom || 1;
    const focus = cv.dataset.focus !== undefined ? +cv.dataset.focus : 0.42;
    const s2 = Math.max(cv.width / img.width, cv.height / img.height) * zoom;
    const dw = img.width * s2, dh = img.height * s2;
    g.drawImage(img, (cv.width - dw) / 2, (cv.height - dh) * focus, dw, dh);
    g.restore();
    Mask.render(g, gr, { stroke: window.BienalTokens.acid, strokeWidth: Math.max(1, cell * 0.07) });
  }

  window.BienalSteps = () => {
    document.querySelectorAll("canvas[data-img]").forEach(paintImgCanvas);
  };

  function wireImages() {
    document.querySelectorAll("canvas[data-img]").forEach((cv) => {
      const slug = cv.dataset.img;
      if (loaded.has(slug) || !IMGS[slug]) return;
      const im = new Image();
      im.decoding = "async";
      im.onload = () => { loaded.set(slug, im); Mask.schedule(); };
      im.src = IMGS[slug];
      loaded.set(slug, null);
    });
    /* los fondos a sangre son CSS, no canvas */
    document.querySelectorAll("[data-bg]").forEach((el) => {
      const src = IMGS[el.dataset.bg];
      if (src) el.style.backgroundImage = "url(" + src + ")";
    });
  }

  /* --cell: la celda se deriva del ancho del viewport (regla Sí-04) y se
     publica para que el CSS de la retícula lea el MISMO paso que el motor. */
  function publishCell() {
    const w = document.documentElement.clientWidth || 1200;
    document.documentElement.style.setProperty("--cell", Math.max(18, Math.round(w / 46)) + "px");
  }
  publishCell();
  window.addEventListener("resize", publishCell, { passive: true });

  /* render */
  $("jump").innerHTML = SEC.map((s) =>
    `<li><a href="#${s.id}"><span class="n">${s.n}</span>${s.tt}</a></li>`).join("");
  $("sections").innerHTML = SEC.map((s) =>
    `<section id="${s.id}" class="${s.cls || ""}">
       <div class="head"><h2>${s.t}</h2><span class="num">${s.n}</span></div>
       ${s.html}
     </section>`).join("");

  /* ---------- el pie: el patrón de la landing, en vivo --------------------
     El directorio se arma desde el MISMO array que renderiza las secciones y
     el nav de anclas — la regla «una sola fuente» aplicada a este documento. */
  const half = Math.ceil(SEC.length / 2);
  const dirCol = (h, items) =>
    `<nav class="f-col"><p class="f-h">${h}</p><ul>` +
    items.map((s) => `<li><a href="#${s.id}">${s.tt}</a></li>`).join("") +
    `</ul></nav>`;
  $("fDir").innerHTML =
    dirCol("El sistema", SEC.slice(0, half)) +
    dirCol("El documento", SEC.slice(half)) +
    `<div class="f-col f-cred"><p class="f-h">Créditos</p><ul>
       <li>${C.creditos.imagen}</li>
       <li>${C.creditos.cielo}</li>
       <li>${C.creditos.autoria}</li>
     </ul></div>`;

  $("fNFmt").textContent   = C.nombre.formato;
  $("fNTema").textContent  = C.nombre.tema;
  $("fNLugar").textContent = C.nombre.lugar;
  $("fNEd").textContent    = C.nombre.edicion;
  $("fBaj").textContent = C.lockup.es.bajada;
  $("fPie").textContent = C.lockup.es.pie;
  $("fEdsH").textContent = "Ediciones";
  $("fEds").innerHTML = C.ediciones.map((e, i) =>
    `<li class="f-ed${i === 0 ? " f-ed--now" : ""}">
       <span class="ord">Nº ${e.n}</span>
       <span class="yr">${e.anio}</span>
       <span class="st">${e.estado}</span>
     </li>`).join("");
  $("fVer").textContent = "Guidelines V0.3.0 «Blanco» · rev. 2026-08-27 · borrador — " + C.ritmo;
  $("fNota").textContent =
    "Sistema generado: cada masa de esta hoja la produjo el mismo algoritmo que corre en la " +
    "landing, y este pie corre el patrón de tres zonas que la sección 14 documenta.";

  wireImages();
  Mask.schedule();
})();
