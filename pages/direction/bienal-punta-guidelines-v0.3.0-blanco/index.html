     quedaban ~6 celdas de borde volcando entre los dos motores. */
  function boxDist(px, py, r) {
    const qx = f(Math.abs(f(px - f(r.x + f(r.w / 2)))) - f(r.w / 2));
    const qy = f(Math.abs(f(py - f(r.y + f(r.h / 2)))) - f(r.h / 2));
    const mx = qx > 0 ? qx : 0, my = qy > 0 ? qy : 0;
    const len = f(Math.sqrt(f(f(mx * mx) + f(my * my))));
    const inner = Math.min(Math.max(qx, qy), 0);
    return f(len + inner);
  }

  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

  /* --- dither ordenado (Bayer) -------------------------------------------
     La única forma que tiene este sistema de desvanecer sin dejar de ser
     duro. Umbral fijo comparado contra la distancia firmada de la máscara:
     cae dentro de la regla del centro de celda, así que el desvanecido
     escalona igual que el borde. Ver el póster Dgtl 20X y Camer Studio.   */

  const BAYER8 = (() => {
    const m = new Float32Array(64);
    for (let y = 0; y < 8; y++) {
      for (let x = 0; x < 8; x++) {
        let v = 0, mask = 4, xc = x, yc = y;
        for (let bit = 0; bit < 3; bit++, mask >>= 1) {
          const bx = (xc & mask) ? 1 : 0, by = (yc & mask) ? 1 : 0;
          v = (v << 2) | ((bx ^ by) << 1) | by;
        }
        m[y * 8 + x] = (v + 0.5) / 64;
      }
    }
    return m;
  })();

  const bayer = (c, r) => BAYER8[(((r % 8) + 8) % 8) * 8 + (((c % 8) + 8) % 8)];

  /* --- el núcleo: una retícula de ocupación ------------------------------
     Se calcula la ocupación booleana por celda ANTES de dibujar. Eso es lo
     que permite que relleno, filete, trama de puntos, knockout y dissolve
     salgan todos de la misma decisión, en vez de ser cinco caminos.        */

  /* --- campo de ruido cacheado -------------------------------------------
     El ruido de una celda NO depende del puntero ni del tiempo: sólo de la
     celda, la semilla y el tamaño de celda. Cacheándolo, un repintado
     interactivo cuesta un clamp y un boxDist por celda en vez de tres vnoise
     (doce hash21). Eso es lo que permite que la pieza corra a 60 fps en canvas
     2D y que NO haga falta WebGL en ninguna superficie — con lo cual el hero
     y la hoja no pueden divergir, porque son el mismo código. */

  const fieldCache = new Map();

  function noiseField(w, h, cell, seed) {
    const key = w + "|" + h + "|" + cell + "|" + seed;
    let fd = fieldCache.get(key);
    if (fd) return fd;
    const ox = -cell, oy = -cell;
    const cols = Math.ceil((w - ox) / cell) + 1;
    const rows = Math.ceil((h - oy) / cell) + 1;
    const n = new Float32Array(cols * rows);
    for (let r = 0; r < rows; r++) {
      const cy = f(f(oy + f(r * cell)) + f(cell / 2));
      for (let c = 0; c < cols; c++) {
        const cx = f(f(ox + f(c * cell)) + f(cell / 2));
        n[r * cols + c] = fbm(f(f(f(cx / cell) * 0.21) + seed),
                              f(f(f(cy / cell) * 0.21) + seed));
      }
    }
    fd = { n, cols, rows, cell, ox, oy, w, h, seed };
    if (fieldCache.size > 40) fieldCache.clear();
    fieldCache.set(key, fd);
    return fd;
  }

  function grid(o) {
    const cell   = o.cell;
    const fringe = o.fringe !== undefined ? o.fringe : cell * 3.2;
    const seed   = o.seed || 0;
    const erode  = o.erode || 0;
    const dither = o.dither || 0;
    const rects  = o.rects || [];
    const mode   = o.mode || "grow";

    const fd = noiseField(o.w, o.h, cell, seed);
    const ox = fd.ox, oy = fd.oy, cols = fd.cols, rows = fd.rows;
    const on = new Uint8Array(cols * rows);
    /* el knockout necesita un segundo campo, con su propia semilla, para que
       las muescas no repitan el mismo ruido que el borde exterior */
    const fdHole = (o.mode === "knockout")
      ? noiseField(o.w, o.h, cell, seed + 19.7) : null;

    /* reach de una celda contra un conjunto de cajas: el ruido se muestrea
       en la retícula gruesa (una lóbula cada 4-5 celdas) — es lo que hace
       que el borde lea como una forma con miembros y no como un rectángulo
       con una capa de pintura rasposa */
    function occupied(idx, cx, cy, boxes, fr, er, src) {
      if (!boxes.length) return -Infinity;
      const n = src.n[idx];
      const reach = f(fr * clamp(f(f(n * 1.95) - 0.47), -0.20, 1.25));
      let d = Infinity;
      for (let i = 0; i < boxes.length; i++) {
        const dd = boxDist(cx, cy, boxes[i]);
        if (dd < d) d = dd;
      }
      return f(f(reach - er) - d);   // > 0 → adentro; el valor es la profundidad
    }

    const field = mode === "knockout"
      ? (o.fieldRect || { x: 0, y: 0, w: o.w, h: o.h })
      : null;
    const notchFringe = o.notchFringe !== undefined ? o.notchFringe : cell * 1.6;

    for (let r = 0; r < rows; r++) {
      const cy = f(f(oy + f(r * cell)) + f(cell / 2));
      for (let c = 0; c < cols; c++) {
        const cx = f(f(ox + f(c * cell)) + f(cell / 2));
        let depth;

        const idx = r * cols + c;
        if (mode === "knockout") {
          /* la masa cubre el campo y se le RESTAN las cajas medidas — es el
             inverso de grow, y es el look del video de referencia: los
             bloques chicos viven en muescas recortadas dentro de la masa */
          depth = occupied(idx, cx, cy, [field], fringe, erode, fd);
          if (depth > 0 && occupied(idx, cx, cy, rects, notchFringe, 0, fdHole) > 0) {
            depth = -1;
          }
        } else {
          depth = occupied(idx, cx, cy, rects, fringe, erode, fd);
        }

        let hit = depth > 0;

        /* dissolve: en una banda del borde hacia adentro, la celda sólo
           sobrevive si supera el umbral ordenado de su posición */
        if (hit && dither > 0) {
          const t = depth / (fringe * dither);
          if (t < 1 && bayer(c, r) > t) hit = false;
        }

        on[idx] = hit ? 1 : 0;
      }
    }

    return { on, cols, rows, cell, ox, oy, w: o.w, h: o.h };
  }

  const at = (g, c, r) =>
    (c < 0 || r < 0 || c >= g.cols || r >= g.rows) ? 0 : g.on[r * g.cols + c];

  /* --- render ------------------------------------------------------------ */

  function render(ctx, g, style) {
    const s = style || {};
    const cell = g.cell;

    if (s.fill) {
      ctx.fillStyle = s.fill;
      if (s.dots) {
        /* trama de puntos dentro de la masa: segundo valor de relleno sin
           segundo color. Del póster zkPass. */
        const k = typeof s.dots === "number" ? s.dots : 0.34;
        const d = Math.max(1, cell * k);
        const off = (cell - d) / 2;
        for (let r = 0; r < g.rows; r++) {
          for (let c = 0; c < g.cols; c++) {
            if (!g.on[r * g.cols + c]) continue;
            ctx.fillRect(g.ox + c * cell + off, g.oy + r * cell + off, d, d);
          }
        }
      } else {
        /* +1 tapa la costura entre celdas contiguas */
        for (let r = 0; r < g.rows; r++) {
          for (let c = 0; c < g.cols; c++) {
            if (!g.on[r * g.cols + c]) continue;
            ctx.fillRect(g.ox + c * cell, g.oy + r * cell, cell + 1, cell + 1);
          }
        }
      }
    }

    /* filete: se traza SÓLO sobre los lados que separan una celda encendida
       de una apagada, así el contorno sigue la escalera exacta en vez de
       aproximarla. Es el filete de las fichas del video. */
    if (s.stroke) {
      ctx.strokeStyle = s.stroke;
      ctx.lineWidth = s.strokeWidth || Math.max(1, cell * 0.09);
      ctx.lineCap = "square";
      ctx.beginPath();
      for (let r = 0; r < g.rows; r++) {
        for (let c = 0; c < g.cols; c++) {
          if (!g.on[r * g.cols + c]) continue;
          const x = g.ox + c * cell, y = g.oy + r * cell;
          if (!at(g, c, r - 1)) { ctx.moveTo(x, y);               ctx.lineTo(x + cell, y); }
          if (!at(g, c, r + 1)) { ctx.moveTo(x, y + cell);        ctx.lineTo(x + cell, y + cell); }
          if (!at(g, c - 1, r)) { ctx.moveTo(x, y);               ctx.lineTo(x, y + cell); }
          if (!at(g, c + 1, r)) { ctx.moveTo(x + cell, y);        ctx.lineTo(x + cell, y + cell); }
        }
      }
      ctx.stroke();
    }
  }

  /* recorta un dibujo cualquiera (una foto) a la máscara. Así entra la
     fotografía al sistema: por la máscara, cuantizada a la celda — nunca a
     sangre y brillante. Arch Guide / Camer Studio. */
  function clipTo(ctx, g) {
    ctx.beginPath();
    const cell = g.cell;
    for (let r = 0; r < g.rows; r++) {
      for (let c = 0; c < g.cols; c++) {
        if (!g.on[r * g.cols + c]) continue;
        ctx.rect(g.ox + c * cell, g.oy + r * cell, cell + 1, cell + 1);
      }
    }
    ctx.clip();
  }

  /* --- capa DOM: la API declarativa por data-* --------------------------- */

  function dpr() { return Math.min(window.devicePixelRatio || 1, 2); }

  function sizeFor(cv) {
    const d = dpr();
    const w = Math.max(1, Math.round(cv.clientWidth * d));
    const h = Math.max(1, Math.round(cv.clientHeight * d));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    return d;
  }

  function readRects(cv, d, pad) {
    /* data-from acepta una LISTA de selectores separados por coma, que es lo
       que habilita knockout con varios bloques de texto. Se mide contra el
       canvas, en píxeles de dispositivo. */
    const host = cv.parentElement;
    const sel = cv.dataset.from || ".inner";
    const cr = cv.getBoundingClientRect();
    const out = [];
    sel.split(",").map((s) => s.trim()).filter(Boolean).forEach((s) => {
      host.querySelectorAll(s).forEach((el) => {
        const er = el.getBoundingClientRect();
        if (!er.width || !er.height) return;
        out.push({
          x: (er.left - cr.left) * d - pad,
          y: (er.top  - cr.top)  * d - pad,
          w: er.width  * d + pad * 2,
          h: er.height * d + pad * 2
        });
      });
    });
    return out;
  }

  function paintBlob(cv) {
    const d = dpr();
    const g2 = cv.getContext("2d");
    sizeFor(cv);
    g2.clearRect(0, 0, cv.width, cv.height);

    const T = root.BienalTokens || {};
    const ACID = T.acid || "#C8F52D";
    const VOID = T.void || "#12140F";
    const QUIET = T.quiet || "#1D2016";

    const cell = (+cv.dataset.cell || 20) * d;
    const fringe = cell * (+cv.dataset.fringeCells || 3.2);
    const seed = +cv.dataset.seed || 0;
    const mode = cv.dataset.mode || "grow";
    const dither = +cv.dataset.dither || 0;
    const pad = cell * 0.5;

    let rects = readRects(cv, d, pad);

    /* bleed: la masa se va del borde en vez de terminar dentro del canvas.
       Ahora las cuatro direcciones, no sólo left/bottom. */
    const bleed = cv.dataset.bleed || "";
    if (mode !== "knockout" && rects.length) {
      const r0 = rects[0];
      if (bleed.includes("left"))   { r0.w += r0.x + fringe; r0.x = -fringe; }
      if (bleed.includes("top"))    { r0.h += r0.y + fringe; r0.y = -fringe; }
      if (bleed.includes("right"))  { r0.w = cv.width  + fringe - r0.x; }
      if (bleed.includes("bottom")) { r0.h = cv.height + fringe - r0.y; }
    }

    let fieldRect = null;
    if (mode === "knockout") {
      const inset = (+cv.dataset.inset || 0) * d;
      fieldRect = { x: inset, y: inset, w: cv.width - inset * 2, h: cv.height - inset * 2 };
    }

    const gr = grid({
      w: cv.width, h: cv.height, cell, fringe, seed, dither, rects, mode, fieldRect,
      notchFringe: cell * (+cv.dataset.notchCells || 1.6)
    });

    /* `data-blob` acepta cuatro cosas: un nombre de token del sistema, "none"
       (sin relleno: sólo queda la retícula en __grid para que otro la use),
       un color literal `#rrggbb`, o el NOMBRE de una custom property —
       `data-blob="--card"` lee `--card` del elemento que contiene al canvas.
       Esa última forma es la que deja que una plancha tome el color de su
       propia ficha sin que el motor tenga que conocer la paleta de §04. */
    const key = cv.dataset.blob;
    const fill =
        key === "none"  ? null
      : key === "void"  ? VOID
      : key === "quiet" ? QUIET
      : key && key.charAt(0) === "#" ? key
      : key && key.slice(0, 2) === "--"
          ? (getComputedStyle(cv.parentElement).getPropertyValue(key).trim() || ACID)
      : ACID;
    const strokeKey = cv.dataset.stroke;
    const stroke = !strokeKey ? null
      : strokeKey === "void" ? VOID : strokeKey === "acid" ? ACID : strokeKey;

    render(g2, gr, {
      fill,
      stroke,
      strokeWidth: cv.dataset.strokeWidth ? +cv.dataset.strokeWidth * d : undefined,
      dots: cv.dataset.fill === "dots" ? (+cv.dataset.dotRatio || 0.34) : false
    });

    cv.__grid = gr;
  }

  /* --- remedición unificada ---------------------------------------------
     Antes: el hero tenía ResizeObserver y la hoja no (una hoja que reflowea
     sin resize de ventana quedaba con máscaras viejas); la hoja tenía
     beforeprint y el hero no; ninguna pausaba fuera de pantalla.          */

  let raf = 0, wired = false;

  function paintAll() {
    document.querySelectorAll("canvas[data-blob]").forEach(paintBlob);
    if (root.BienalSteps) root.BienalSteps();
  }

  function schedule() {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(paintAll);
  }

  function wire() {
    if (wired) return;
    wired = true;
    paintAll();
    window.addEventListener("resize", schedule, { passive: true });
    window.addEventListener("beforeprint", paintAll);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) schedule(); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(schedule);
      document.querySelectorAll("canvas[data-blob]").forEach((cv) => {
        if (cv.parentElement) ro.observe(cv.parentElement);
      });
    }
  }

  root.Mask = {
    hash21, vnoise, fbm, boxDist, bayer, clamp,
    grid, render, clipTo, at,
    paintBlob, paintAll, schedule, wire, sizeFor, dpr
  };

  if (typeof document !== "undefined") {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", wire);
    } else {
      wire();
    }
  }
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
(() => {
  "use strict";
  const C = window.Bienal, $ = (id) => document.getElementById(id);
  const T = getComputedStyle(document.documentElement);
  window.BienalTokens = { acid: T.getPropertyValue("--acid").trim(),
                          void: T.getPropertyValue("--void").trim(),
                          quiet: T.getPropertyValue("--quiet").trim() };

  $("mLbl").textContent = C.nombre.completo + " · V0.3.0 · rev. 2026-08-27";
  $("mSub").textContent = "El sistema operable: no una imagen, un conjunto de reglas reutilizables.";

  $("intro").textContent =
    "Este documento lo leen dos audiencias desde el día uno: personas que aplican la marca, " +
    "y agentes que producen piezas. Por eso cada regla de acá es exactamente una de tres cosas — " +
    "un token que un agente lee, un chequeo binario que un agente corre, o un juicio humano con " +
    "dueño y compuerta. Una regla que no encaja en ninguna de las tres no está terminada. " +
    "Esta revisión incorpora las decisiones de la landing del 2026-08-27: la paleta editorial " +
    "scopeada, la marca de dunas, el pie como directorio, la mecánica de flip y la capa en inglés.";

  const A = "token", B = "chequeo", Cc = "juicio";
  const cls = { [A]: "cls-a", [B]: "cls-b", [Cc]: "cls-c" };
  const ruleHTML = (r) =>
    `<div class="rule"><span class="cls ${cls[r.k]}">${r.k}</span>
       <span class="txt">${r.t}${r.who ? `<span class="who">${r.who}</span>` : ""}</span></div>`;

  $("threeway").innerHTML = [
    { k: A,  t: "<b>Token</b> — un valor que se lee: custom props en <code>:root</code>, escalas, fórmulas de tamaño." },
    { k: B,  t: "<b>Chequeo binario</b> — un sí/no que se corre: hex de fondo, peso de cuerpo, tope de tamaño, lista de palabras prohibidas." },
    { k: Cc, t: "<b>Juicio humano nombrado</b> — gusto o autoridad, con dueño y compuerta explícitos.", who: "Si no dice quién decide, no es esta clase: es una regla sin terminar" }
  ].map(ruleHTML).join("");

  /* demo declarativo: cada frame lo genera el motor.
     El tercer argumento es el CAMPO del frame: los demos de masa void van
     sobre campo claro — void sobre void era invisible, y así se publicó una
     vez. El default sigue siendo el frame oscuro para las masas ácidas. */
  const demo = (attrs, cap, field) =>
    `<div class="demo"><div class="frame"${field ? ` style="background:${field};outline:2px solid var(--void);outline-offset:-2px"` : ""}>
       <canvas ${attrs} data-from=".anchor" aria-hidden="true"></canvas>
       <span class="anchor" aria-hidden="true"></span>
     </div><div class="cap">${cap}</div></div>`;
  const CLARO = "var(--acid)";   /* el campo claro del sistema, sea ácido o blanco */

  const SEC = [];

  /* ---- 01 ---- */
  SEC.push({ id: "idea", n: "01", t: "La <em>idea</em>", tt: "La idea", html: `
    <p class="body">${C.posicionamiento}</p>
    <p class="body">La marca sostiene seis tensiones y no resuelve ninguna. Eso no es indecisión:
      es la tesis. Un evento se produce una vez; una bienal se instala.</p>
    <blockquote>${C.pruebaDecision}<br><span style="font-family:var(--mono);font-size:.7em;letter-spacing:.1em;text-transform:uppercase">${C.pruebaDecisionAdenda}</span></blockquote>
    <div class="rules">${[
      { k: B, t: "Toda pieza pasa la <b>prueba de decisión</b>: si resuelve una tensión en vez de sostenerla, está mal." },
      { k: B, t: "Los seis ejes se sostienen: " + C.ejes.map(e => e.de + "→" + e.a.split(",")[0]).join(" · ") + "." },
      { k: B, t: "La promesa en voz activa que abre el sitio es verbatim de René: «Regulators on the record, capital at the table, and the builders they fund.» Es la única frase de su cuerpo que sobrevive entera al canon — no se parafrasea." },
      { k: Cc, t: "Cuándo una pieza sostiene o resuelve una tensión.", who: "Decide: René (dirección narrativa), en la revisión de territorio" }
    ].map(ruleHTML).join("")}</div>` });

  /* ---- 02 ---- */
  SEC.push({ id: "masa", n: "02", t: "La <em>masa</em>", tt: "La masa", html: `
    <p class="body">El dispositivo central. No es una forma con borde blando: es un <b>bitmap</b>.
      Todo se decide en el <b>centro de la celda</b>, así que el borde sólo puede escalonar en
      ángulo recto. Esa escalera es todo el lenguaje.</p>
    <p class="mono-body">celda   = centro(floor(posición / celda))<br>
      alcance = franja × clamp(ruido × 1.95 − 0.47, −0.20, 1.25)<br>
      máscara = alcance − erosión ≥ distancia_a_la_caja</p>
    <p class="body">Las máscaras <b>no están dibujadas</b>. El motor recibe el <em>bounding box
      medido</em> de bloques de texto reales y hace crecer la mancha alrededor. Se cambia el copy o
      el breakpoint y la máscara se recorta sola: la pieza no está compuesta, está generada.</p>
    <div class="demos">${[
      demo('data-blob="acid" data-seed="11.3" data-cell="14" data-fringe-cells="3.2"', "<b>Grow</b> — la masa crece alrededor de la caja medida. Modo por defecto."),
      demo('data-blob="acid" data-mode="knockout" data-seed="41.2" data-cell="14" data-fringe-cells="2.6" data-notch-cells="1.5" data-inset="8"', "<b>Knockout</b> — la masa cubre el campo y se le restan las cajas. El texto vive en muescas."),
      demo('data-blob="acid" data-seed="7.7" data-cell="26" data-fringe-cells="3.2"', "<b>Celda grande</b> — misma fórmula, celda 26. La escalera crece, el lenguaje no cambia."),
      demo('data-blob="acid" data-seed="7.7" data-cell="9" data-fringe-cells="3.2"', "<b>Celda chica</b> — celda 9. La celda se deriva del ancho del viewport, nunca se fija en px absolutos.")
    ].join("")}</div>
    <div class="rules">${[
      { k: A, t: "Celda: <code>max(12, round(anchoViewport / 46))</code> × dpr. La franja es <code>celda × 2.4…3.4</code>, <b>siempre relativa a la celda</b>." },
      { k: B, t: "Todo borde de máscara es un ángulo recto. Sin curvas, sin difuminado, sin sombra." },
      { k: B, t: "Ninguna máscara dibujada a mano: si no la generó la retícula, no es del sistema." },
      { k: B, t: "La caja anfitriona va <code>width: fit-content</code> y <b>sin altura forzada</b>. Si la caja se estira, la máscara tapa todo — ya pasó una vez." },
      { k: B, t: "El padding del bloque de texto no es decorativo: es lo que garantiza que el fleco nunca muerda una letra. Mínimo <code>celda × 0.5</code>." },
      { k: B, t: "La erosión sólo muerde el fleco, nunca el núcleo medido." }
    ].map(ruleHTML).join("")}</div>
    <h3 class="sub-h">La plancha de ficha — la masa como casillero</h3>
    <p class="body">Nuevo consumidor del motor desde el tablero de §04 de la landing: cada ficha de
      datos es una <b>plancha generada</b>, no un rectángulo CSS. El canvas lee la tinta de su
      propia ficha (<code>data-blob="--card"</code>) y crece desde una caja invisible metida hacia
      adentro del casillero. El borde de la plancha cae <em>entre</em> el borde del casillero y ese
      margen: nunca se recorta plano contra el canvas, que es lo que delataría el truco.</p>
    <div class="rules">${[
      { k: A, t: "La cuenta de la plancha: caja fuente <code>--bite</code> adentro (24px en el tablero), canvas desbordando <code>--room: 14px</code> por los cuatro lados — más que el alcance máximo (<code>franja × 1.25 ≈ 26px</code> con celda 11), así ninguna celda muere al ras." },
      { k: B, t: "Si un lado de la plancha sale perfectamente recto, no lo decidió la máscara: lo recortó el canvas. Es un bug, no un estilo — pasó en siete de nueve fichas del primer ajuste." },
      { k: A, t: "El gap de la grilla iguala a <code>--room</code> (14px): dos planchas vecinas en su pico simultáneo se rozan, nunca se superponen." },
      { k: B, t: "Semilla propia por ficha, con paso primo respecto de la celda (<code>i × 17.3 + 5.1</code>). Nueve planchas con el mismo campo de ruido leen como textura aplicada, no como nueve piezas." }
    ].map(ruleHTML).join("")}</div>` });

  /* ---- 03 ---- */
  SEC.push({ id: "dissolve", n: "03", t: "El <em>dissolve</em>", tt: "El dissolve", html: `
    <p class="body">Lo único que le faltaba al sistema: una forma de <b>desvanecer sin dejar de ser
      duro</b>. Un gradiente está prohibido — rompería la regla del ángulo recto. La solución es un
      <b>umbral ordenado de Bayer</b> 8×8 comparado contra la profundidad firmada de la máscara:
      la celda sobrevive si supera el umbral de su posición. El desvanecido escalona igual que el borde.</p>
    <div class="demos">${[0, 0.35, 0.7, 1.1].map((d, i) =>
      demo(`data-blob="acid" data-seed="19.4" data-cell="12" data-fringe-cells="3.0" data-dither="${d}"`,
           `<b>dither ${d}</b> — ${["sin dissolve","borde apenas abierto","tablero de ajedrez","la masa se deshace"][i]}`)).join("")}</div>
    <div class="rules">${[
      { k: A, t: "<code>data-dither</code> de 0 a ~1.2. Es la fracción de la franja donde actúa el umbral." },
      { k: B, t: "Nunca un gradiente, un blur ni una opacidad parcial para desvanecer una masa. Sólo dither." },
      { k: B, t: "El dissolve no toca el núcleo: una masa que sostiene tipografía no puede tener dither > 0.6." },
      { k: A, t: "El dissolve puede manejarlo el scroll: la pila de la landing corre dither 0.55 en los extremos del recorrido y ~0 en el centro. La promesa «movés vos · se deshace» se cumple — lo mueve la persona, no un temporizador." },
      { k: Cc, t: "Cuándo una pieza pide dissolve. Sirve para lo que se aleja en el tiempo o en jerarquía.", who: "Decide: dirección de arte, por pieza" }
    ].map(ruleHTML).join("")}</div>` });

  /* ---- 04 ---- */
  SEC.push({ id: "reticula", n: "04", t: "Retícula y <em>mobiliario</em>", tt: "Retícula y mobiliario", html: `
    <p class="body">La misma celda que gobierna la máscara gobierna la retícula visible y las marcas
      de registro. El mobiliario no decora: <b>declara que la pieza es una plancha</b>. Pero la retícula
      es <b>señal, no papel de fondo</b>: aparece donde trabaja, y en ningún otro lado.</p>
    <div class="rules">${[
      { k: A, t: "<b>Un solo paso de retícula en todo el sistema, y es la CELDA</b> — se publica como <code>--cell</code> y la leen el motor y el CSS. Hairline de la tinta, opacidad <code>.14–.18</code>." },
      { k: B, t: "<b>Nada de papel cuadriculado ambiente.</b> Ninguna capa fija a pantalla completa tira la retícula encima de todo el sitio — sobre la fotografía del hero leía como líneas clavadas sobre la imagen." },
      { k: A, t: "<b>La retícula va sobre campo de color plano.</b> En una plancha de tinta —una losa ácida entera— es lo que le da densidad de papel impreso al campo vacío. Ahí es siempre." },
      { k: B, t: "<b>Tampoco sobre papel vacío.</b> Cuando §03 perdió su fotografía, la retícula quedó dibujando grilla sobre blanco sin nada que atar: densidad sin trabajo. La retícula necesita una foto que anclar o una plancha que densificar — sobre campo desnudo se apaga." },
      { k: Cc, t: "Sobre fotografía la retícula es <b>decisión por sección, no automática</b>. Ata la imagen al sistema cuando la foto es fondo y las masas son el contenido; la ensucia cuando la fotografía ES el sujeto (§06, la arquitectura del MACA: sin retícula).", who: "Decide: dirección de arte, por sección" },
      { k: B, t: "Ninguna superficie dibuja su propio paso además de la celda. Tres pasos conviviendo —48 px, 44 px y la celda— imprimían dos grillas superpuestas sobre la fotografía." },
      { k: A, t: "Marcas de registro: cruz de 13 px, en las cuatro esquinas, en el margen, opacidad <code>.8</code>." },
      { k: B, t: "Las marcas van en las <b>cuatro</b> esquinas o en ninguna. Nunca tres." },
      { k: B, t: "El radio del sistema es cero. <code>border-radius: 0</code> en todo, sin excepción. Los círculos tampoco: la insignia del tablero es un cuadrado macizo, y el rótulo de acción un rectángulo duro — la referencia de app traía radio 24, píldoras e insignias circulares y las tres cosas se tradujeron, no se copiaron." },
      { k: A, t: "Curvas nombradas: <code>--ease-out</code>, <code>--ease-step</code>, <code>--ease-in</code>. Ninguna palabra clave suelta." }
    ].map(ruleHTML).join("")}</div>` });

  /* ---- 05 ---- */
  SEC.push({ id: "imagen", n: "05", t: "Imagen en la <em>masa</em>", tt: "Imagen en la masa", html: `
    <p class="body">La fotografía es el <b>único tono medio</b> del sistema. Entra siempre
      <b>recortada a la máscara</b>, en color pleno y sin filtro. El bitmap lo aporta el borde, no
      la foto: cuantizar la imagen la vuelve ilegible y además contradice la regla.</p>
    <p class="body"><b>Inventario: 13 imágenes, en dos familias.</b></p>
    <p class="body"><b>Ocho sujetos que entran POR la máscara</b> — uno de cielo (stock) y siete del
      proyecto. Los siete son <b>renders generados, no fotografías de las sedes</b>: el interior
      rotulado MACA no es el MACA, y no existen tres fotos de casas distintas. El rótulo original de
      una de las rutas estaba mal en tres de ocho.</p>
    <p class="body"><b>Cuatro fondos a sangre de sección</b>, que van enteros detrás de una sección y
      llevan las masas encima. Uno de ellos, la arquitectura del MACA, es <b>la única fotografía real
      de una sede que tiene el proyecto</b>. Aun así la superficie pública no la rotula: mientras el
      resto del set sea material generado, la regla se sostiene pareja. Dos de los cuatro suman
      problemas propios — el retrato es <b>una persona identificable</b> y necesita cesión de imagen,
      y la foto del MACA necesita permiso del museo. Los fondos se mueven: <code>costa-rocas</code>
      salió de §03 (parkeada por pedido) y entró desenfocada detrás del tablero de §04.</p>
    <div class="rules">${[
      { k: B, t: "Ninguna imagen se rotula con el nombre de una sede real mientras sean renders." },
      { k: B, t: "Una imagen va <b>o</b> dentro de una máscara, <b>o</b> a sangre como fondo de sección, <b>o</b> entera en <b>placa rectangular</b>. En el caso a sangre el texto <b>nunca</b> se apoya en la foto: va sobre una masa o dentro de una muesca." },
      { k: B, t: "<b>La placa rectangular</b> — el modo de las cinco salas del programa desde el 2026-08-27: la foto entera, sin clip de máscara y sin filete escalonado. Es <b>opt-in por atributo</b> (<code>data-plain=\"1\"</code>), nunca por fallback — un canvas enmascarado al que le falla la retícula se volvería plano en silencio." },
      { k: Cc, t: "Un fondo fotográfico de sección <b>puede</b> llevar la retícula de celda encima, al 14–18 %: declara que la foto entró al sistema y no está pegada. Deja de aplicarse cuando la fotografía es el sujeto y no el fondo.", who: "Decide: dirección de arte, por sección" },
      { k: B, t: "La foto va en color pleno y sin filtro. Sin duotono, sin cuantizar, sin blanco y negro." },
      { k: B, t: "<b>La excepción anotada: el desenfoque como campo.</b> El fondo del tablero de §04 va con <code>blur(26px)</code> porque el detalle de alta frecuencia de la piedra competía con los bordes escalonados de las planchas — que son justamente lo que la sección tiene que dejar ver. Desenfocada, la foto vuelve a ser campo. Rompe la regla de arriba y se anota en la pieza, no se esconde. Técnica: capa con <code>inset: -6%</code> + <code>overflow: hidden</code> en la sección — el blur samplea más allá del borde y sin margen extra deja viñeta clara en los cuatro cantos." },
      { k: Cc, t: "Cuándo una foto puede entrar desenfocada como campo: sólo cuando las planchas son el contenido y la imagen es atmósfera. Nunca cuando la fotografía es el sujeto.", who: "Decide: dirección de arte, por sección — y queda registrado en §16" },
      { k: B, t: "El hover del programa (§05 de la landing) trae la foto de la sala desenfocada a pantalla completa. Es un <b>gesto</b>: entra y sale por opacidad, la imagen queda cargada — apagarla en el primer fotograma convierte la salida en parpadeo." },
      { k: B, t: "Toda pieza con imagen generada lleva la línea: «" + C.creditos.imagen + "»." },
      { k: B, t: "El cielo lleva su línea de crédito hasta que se sustituya: «" + C.creditos.cielo + "». El crédito y la imagen viajan juntos, siempre: si el cielo sale del sitio (variante Blanco), la línea sale con él." },
      { k: Cc, t: "Qué tiene que pasar una foto nueva: ser del corredor, no ser folleto turístico, y aguantar el recorte a la máscara.", who: "Decide: René. Licencia y derechos: Andrés" }
    ].map(ruleHTML).join("")}</div>
    <h3 class="sub-h">Los cinco tratamientos</h3>
    <p class="body">Los cuatro primeros son las formas permitidas de meter una imagen — el cuarto es
      la excepción anotada. El quinto es el contraejemplo, y está acá porque es lo que sale por
      defecto si nadie aplica el sistema.</p>
    <div class="imgdemos">

      <div class="imgdemo">
        <figure>
          <div class="fr">
            <span class="tag">01 · recorte a la máscara</span>
            <canvas data-blob="none" data-img="el-foro" data-seed="23.7" data-cell="13"
                    data-fringe-cells="3.0" data-bleed="left bottom"
                    data-from=".key" aria-hidden="true"></canvas>
            <span class="key" style="position:absolute;left:7%;top:15%;width:80%;height:68%"></span>
          </div>
          <figcaption><b>El tratamiento base.</b> La foto va en color pleno y sin filtro; el bitmap lo
            aporta el <b>borde</b>, no la imagen. El filete declara que está recortada, no flotando.</figcaption>
        </figure>
      </div>

      <div class="imgdemo">
        <figure>
          <div class="fr">
            <span class="tag">02 · dissolve del fleco</span>
            <canvas data-blob="none" data-img="punta" data-seed="58.1" data-cell="13"
                    data-fringe-cells="5.4" data-dither="0.52" data-bleed="bottom"
                    data-from=".key" aria-hidden="true"></canvas>
            <span class="key" style="position:absolute;left:9%;top:17%;width:74%;height:62%"></span>
          </div>
          <figcaption><b>Las celdas sueltas llevan la foto, no tinta plana.</b> Es lo que hace que la
            imagen se deshaga <i>hacia</i> el fondo en vez de terminar en un borde. Techo
            <code>0.6</code>: más alto y el dissolve se come el núcleo.</figcaption>
        </figure>
      </div>

      <div class="imgdemo">
        <figure>
          <div class="fr">
            <span class="tag">03 · a sangre, con retícula</span>
            <div class="bleed grid" data-bg="maca-real"></div>
          </div>
          <figcaption><b>Fondo de sección.</b> La retícula de celda al 14–18 % es lo que declara que la
            foto entró al sistema. Encima van masas, nunca texto suelto.</figcaption>
        </figure>
      </div>

      <div class="imgdemo">
        <figure>
          <div class="fr">
            <span class="tag">04 · desenfocada como campo</span>
            <div class="bleed blur" data-bg="costa-rocas"></div>
            <div class="plate-demo">La plancha es el contenido; la foto es atmósfera.</div>
          </div>
          <figcaption><b>La excepción anotada.</b> Sólo cuando las planchas son el contenido. El blur
            va en una capa con <code>inset</code> negativo para no dejar viñeta. Se registra en la
            pieza y en §16 — nunca se aplica en silencio.</figcaption>
        </figure>
      </div>

      <div class="imgdemo imgdemo--no">
        <figure>
          <div class="fr">
            <span class="tag">No — sin tratamiento</span>
            <div class="bleed" data-bg="costa-rocas"></div>
          </div>
          <figcaption><b>Lo que no se hace.</b> Foto a sangre, grande y brillante, sin retícula, sin
            máscara y sin masa encima. No es del sistema: es una foto de fondo.</figcaption>
        </figure>
      </div>

    </div>

    <div class="dd">
      <div class="si"><h4>Sí</h4><ul>
        <li>Mar abierto, el relevamiento del corredor de Maldonado, la ola de madera del MACA, una carta batimétrica.</li>
        <li>Una toma propia de Punta, con cielo limpio.</li></ul></div>
      <div class="no"><h4>No — y esto es absoluto</h4><ul>
        <li><b>La Mano, Los Dedos, y manos en cualquier forma.</b> Obra atribuida a Mario Irarrázabal, autor vivo y dentro de plazo. Una foto CC0 licencia la fotografía, no la escultura.</li>
        <li>Punta de folleto turístico: atardeceres, yates, palmeras, lifestyle de playa.</li></ul></div>
    </div>` });

  /* ---- 06 ---- */
  SEC.push({ id: "color", n: "06", t: "El <em>color</em>", tt: "Color", html: `
    <p class="body"><b>Dos tintas y una fotografía.</b> El ácido es <em>campo</em>: si aparece como
      acento suelto sobre negro, el sistema se perdió. La inversión resuelve todas las jerarquías,
      y por eso no hace falta una tercera tinta.</p>
    <table class="tk"><thead><tr><th>Token</th><th>Valor</th><th>Rol</th></tr></thead><tbody>
      <tr><td class="m">--acid</td><td class="m"><span class="sw" style="background:#C8F52D"></span>#C8F52D</td><td>Tinta 01. Campo dominante.</td></tr>
      <tr><td class="m">--void</td><td class="m"><span class="sw" style="background:#12140F"></span>#12140F</td><td>Tinta 02. Casi negro con sesgo verde. Tipografía, máscaras, reglas.</td></tr>
      <tr><td class="m">--quiet</td><td class="m"><span class="sw" style="background:#1D2016"></span>#1D2016</td><td><b>Tercer valor, no tercera tinta.</b> Masa negra sobre negro, legible sólo como textura.</td></tr>
      <tr><td class="m">--paper</td><td class="m"><span class="sw" style="background:#F4F1E8"></span>#F4F1E8</td><td>Modo fondo claro. Print y papelería.</td></tr>
      <tr><td class="m">--acid-d</td><td class="m"><span class="sw" style="background:#A5CE1E"></span>#A5CE1E</td><td>Ácido oscurecido. Sólo estados <code>:active</code>.</td></tr>
      <tr><td class="m">--sky-mid</td><td class="m"><span class="sw" style="background:#7FC3EE"></span>#7FC3EE</td><td>El tono medio propio del cielo. Nunca un gris.</td></tr>
    </tbody></table>
    <div class="demos">${[
      demo('data-blob="void" data-seed="3.3" data-cell="13" data-fringe-cells="3.1"', "<b>Void sobre campo claro</b> — la combinación base.", CLARO),
      demo('data-blob="quiet" data-seed="55.1" data-cell="13" data-fringe-cells="3.1"', "<b>Tercer valor</b> — masa silenciosa. Jerarquía sin una tinta nueva."),
      demo('data-blob="void" data-fill="dots" data-dot-ratio="0.34" data-seed="88.2" data-cell="11" data-fringe-cells="3.2"', "<b>Trama de puntos</b> — segundo valor de relleno, un solo color.", CLARO)
    ].join("")}</div>
    <div class="rules">${[
      { k: A, t: "Proporción en superficie ácida: ~70 ácido / ~28 void / ~2 la foto como respiro." },
      { k: B, t: "Dos fondos: ácido o void. Sin alternativas — salvo la excepción scopeada de abajo." },
      { k: B, t: "Ningún gris. Si hace falta un tono medio, entra el cielo." },
      { k: B, t: "Ninguna tercera <b>tinta</b>. El tercer <b>valor</b> sí, y es <code>--quiet</code>." },
      { k: B, t: "El ácido nunca es acento suelto sobre negro." }
    ].map(ruleHTML).join("")}</div>

    <h3 class="sub-h">La paleta editorial — la excepción scopeada</h3>
    <p class="body">El tablero de §04 de la landing corre <b>cuatro tintas editoriales sobre crema</b>,
      por pedido del cliente. <b>Rompe No-02</b> («ninguna tercera tinta») y no se esconde: se
      registra acá y en §16, y René ratifica o veta. Mientras tanto la excepción vive con tres
      cinturones puestos: está <b>scopeada</b> a tres consumidores (§03, §04 y el cierre — nada se
      filtra al resto del sitio), la <b>tinta de texto vuelve a ser</b> <code>--void</code> (no un
      negro azulado propio: una variable menos que se aparta), y la <b>forma sigue siendo la del
      sistema</b> — plancha de máscara, insignia cuadrada, rectángulo duro. Cambió la piel, no la
      lengua.</p>
    <div class="edpal">
    <table class="tk"><thead><tr><th>Token</th><th>Valor</th><th>Rol</th></tr></thead><tbody>
      <tr><td class="m">--c-peri</td><td class="m"><span class="sw" style="background:#969DDA"></span>#969DDA</td><td>Periwinkle — el bloque superior de la referencia impresa.</td></tr>
      <tr><td class="m">--c-tan</td><td class="m"><span class="sw" style="background:#C6AB7E"></span>#C6AB7E</td><td>Tan / camel — la columna derecha.</td></tr>
      <tr><td class="m">--c-red</td><td class="m"><span class="sw" style="background:#E8503F"></span>#E8503F</td><td>Bermellón — el acento: <b>una sola vez por pieza, como máximo</b>. La referencia trae #E23B2C, que con tinta encima da 4.32:1; se aclaró lo mínimo para cruzar 4.5:1 (queda 4.99:1). Hoy sin consumidor — ver §16.</td></tr>
      <tr><td class="m">--c-sage</td><td class="m"><span class="sw" style="background:#9FB185"></span>#9FB185</td><td>Verde salvia — la faja de la primera referencia.</td></tr>
      <tr><td class="m">(crema)</td><td class="m"><span class="sw" style="background:#F2EDE4"></span>#F2EDE4</td><td>El papel de los rótulos invertidos dentro de las fichas. No es fondo de sección.</td></tr>
      <tr><td class="m">(papel)</td><td class="m"><span class="sw" style="background:#FFFFFF"></span>#FFFFFF</td><td>El campo de §03 y el cierre — el registro más callado de la paleta.</td></tr>
    </tbody></table>
    <div class="edcards">
      ${[["peri","415","billion USD","Latin America on-chain volume",false,"5.1"],
         ["sage","42.5","%","Year over year — the fastest-accelerating region",false,"22.4"],
         ["tan","—","On-chain volume by market","billion USD, trailing twelve months",true,"39.7"],
         ["ink","20.345","Law","Virtual-asset framework in force — written, not promised",false,"57.0"]]
        .map(([c, v, u, t, mock, seed]) => `
      <div class="edcard edcard--${c}">
        <canvas data-blob="--card" data-mode="grow" data-seed="${seed}"
                data-cell="11" data-fringe-cells="1.9" data-from=".dc-src" aria-hidden="true"></canvas>
        <span class="dc-src" aria-hidden="true"></span>
        <div class="in"><span class="u">${u}</span><span class="v">${v}</span>
          <span class="t">${t}</span>${mock ? '<span class="mock">Mock</span>' : ""}</div>
      </div>`).join("")}
    </div>
    <p class="body">Y la misma paleta, dicha en su registro más callado: <b>el difuminado de
      esquinas</b> de §03 y el cierre. Papel blanco con las cuatro tintas entrando por las esquinas,
      en dos capas de gradiente radial por esquina — una masa ancha y baja más un núcleo denso
      pegado al vértice, que es lo que da la caída no lineal de un blur de verdad. No es una quinta
      cosa: la sección estrena color sin estrenar tinta.</p>
    <div class="edcorners"><div class="ficha">El texto nunca se apoya sobre el color: se apoya
      sobre la ficha, que es opaca y se recorta contra el campo.</div></div>
    </div>
    <div class="rules">${[
      { k: B, t: "La paleta editorial vive <b>scopeada</b> en sus consumidores sancionados (§03, §04, cierre — y este manual). Si un token <code>--c-*</code> aparece fuera de ese scope, es una violación, no una extensión." },
      { k: B, t: "La tinta de texto sobre la paleta es <code>--void</code>. Ningún negro propio." },
      { k: B, t: "Contraste mínimo 4.5:1 para texto chico sobre cada tinta, <b>medido color por color</b> — la opacidad de etiqueta .90 es el piso que las cuatro cruzan; .62 pasaba sobre pasteles y sobre esta paleta caía a 2.78:1 en la roja." },
      { k: B, t: "El bermellón es acento: una vez por pieza como máximo, y en las esquinas entra más flojo que las otras tres — si pesa lo mismo que el periwinkle deja de leerse como acento en las dos secciones." },
      { k: B, t: "El difuminado de esquinas va en gradientes de dos capas, nunca <code>filter: blur()</code> sobre manchas: el filtro sangra por los bordes de la sección y cuesta una capa de composición por scroll." },
      { k: Cc, t: "Si la paleta editorial queda como excepción scopeada, se promueve a sistema, o se retira.", who: "Decide: René. Registrada en §16 — el pedido es del cliente, la contradicción con No-02 es real" }
    ].map(ruleHTML).join("")}</div>

    <h3 class="sub-h">La variante Blanco — otra paleta, la misma página</h3>
    <p class="body">Existe una segunda horneada de la landing: <b>«Blanco»</b>. No es una segunda
      landing — es el mismo template, el mismo motor y el mismo copy con una capa de recolor al
      final de la hoja, levantada de un frame de Figma por diff de píxeles. El ácido pasa a blanco
      (<code>#FFFFFF</code>, con <code>#D8D8D2</code> de <code>:active</code>) y la masa negra pasa
      a campo olivo (<code>#7B7C6C</code>) <b>por elemento, no global</b>. El cielo sale del sitio
      entero — y su crédito sale con él.</p>
    <div class="rules">${[
      { k: B, t: "La variante es una <b>capa de recolor</b> sobre el template compartido, nunca un fork: un fork empieza a mentir en la primera edición." },
      { k: B, t: "Blanco sobre la plancha lima es ilegible (~1.7:1): en la variante, la tesis va en blanco <b>porque debajo hay fotografía</b>. La regla de contraste manda sobre la de paleta." },
      { k: Cc, t: "Máscaras o Blanco — las dos horneadas existen para mirarse lado a lado y elegir.", who: "Decide: René, junto con el pick de dirección" }
    ].map(ruleHTML).join("")}</div>` });

  /* ---- 07 ---- */
  SEC.push({ id: "tipo", n: "07", t: "La <em>tipografía</em>", tt: "Tipografía", html: `
    <p class="body">Cuatro familias, cada una con un trabajo nombrado. Display tiene <b>tres voces
      atadas a los slots del nombre</b>: pixel en los slots fijos, serif itálica en el slot que el
      canon declara <em>variable</em>, y Archivo 900 para todo lo demás.</p>
    <div class="spec"><div class="meta">Handjet 800<br>slots fijos<br><code>--pixel</code></div><div class="v-pixel">Bienal Punta 2027</div></div>
    <div class="spec"><div class="meta">Instrument Serif<br>itálica 400<br>slot variable<br><code>--tema</code></div><div class="v-tema">Blockchain</div></div>
    <div class="spec"><div class="meta">Archivo 900<br>titulares<br><code>--disp</code></div><div class="v-disp">Es una bienal, no un summit anual</div></div>
    <div class="spec"><div class="meta">Archivo 600<br>bajada</div><div class="v-lead">${C.bajada.publico.linea}</div></div>
    <div class="spec"><div class="meta">IBM Plex Mono 600<br>datos y etiquetas<br><code>--mono</code></div><div class="v-mono">Capital · Reglas · Infraestructura</div></div>
    <div class="rules">${[
      { k: A, t: "Escala de las tres voces: <code>--t-formato: clamp(30px, 6.6vw, 92px)</code> · <code>--t-tema: clamp(46px, 10.4vw, 158px)</code> · <code>--t-lugar: clamp(38px, 8.2vw, 118px)</code>." },
      { k: B, t: "<b>Ninguna cuarta voz display.</b> Tres, una por slot." },
      { k: A, t: "<b>La gramática del lockup se repite en cada sección:</b> el ordinal va en la cara de píxeles —la de los slots fijos— y una palabra del titular en la serif itálica, la del slot variable. No es decoración: es el nombre dicho en cada cabezal. Este documento la corre también." },
      { k: B, t: "La serif itálica nunca va en cuerpo ni en datos. Fuera del slot del tema entra como <b>acento display con slot nombrado</b>: la palabra del titular de sección, la línea del medio de la pila, y el titular entero de las fichas de audiencia (§02 de la landing). Cada slot nuevo se registra en §16 — la lista está creciendo y eso es exactamente el riesgo." },
      { k: B, t: "Cuando la itálica toma un titular entero, <b>compensa el peso con cuerpo</b>: Instrument Serif 400 pesa mucho menos que Archivo 900, así que al mismo tamaño el cambio de voz se leería como pérdida, no como jerarquía. En las fichas de audiencia sube de <code>--t-sub</code> a <code>clamp(1.5rem, 3.2vw, 2.35rem)</code>." },
      { k: B, t: "La itálica no va en versalitas: pierde el carácter en caja alta, que es justamente lo que aporta." },
      { k: B, t: "Handjet tiene piso de tamaño: <b>nunca por debajo de 18 px</b>. Más chico lee retro-gaming, que colisiona con «institucional»." },
      { k: B, t: "Si una línea informa, es mono." },
      { k: B, t: "Display en Archivo va sólo a 900. Ningún peso intermedio." },
      { k: A, t: "El eje <code>ELGR</code> de Handjet se puede manejar desde la misma <code>celda</code> de la máscara: una celda gobierna el bitmap y la letra." },
      { k: A, t: "La pila justifica <b>con cuerpos distintos por línea</b>, medidos con <code>getBoundingClientRect()</code> (nunca <code>scrollWidth</code>: redondea para abajo y el error saca scroll horizontal). Abrir el tracking para simular justificado deja huecos que, en una voz cuyo paso es la celda, leen como error." },
      { k: Cc, t: "Si el voltaje del ácido más la itálica lee «institucional, no corporativo».", who: "Decide: René. Es la tensión más real que tiene la dirección" }
    ].map(ruleHTML).join("")}</div>` });

  /* ---- 08 ---- */
  SEC.push({ id: "lockup", n: "08", t: "Nombre, lockup y la <em>marca</em>", tt: "Nombre, lockup y la marca", html: `
    <p class="body">Estructura <code>[formato] [tema] [lugar] [edición]</code>. El slot del
      <b>tema</b> es el que la sintaxis declara variable — la evolución de edición a edición está
      permitida por construcción, no es un rebranding. Por eso lleva la voz distinta.</p>
    <div class="lock">
      <div class="l1">Bienal <em>Blockchain</em> Punta 2027</div>
      <div class="l2">${C.lockup.es.bajada}</div>
      <div class="l3">${C.lockup.es.pie}</div>
      <div class="slots">
        <span class="slot">formato · fijo · pixel</span>
        <span class="slot var">tema · variable · serif itálica</span>
        <span class="slot">lugar · fijo · pixel</span>
        <span class="slot">edición · fijo · pixel</span>
      </div>
    </div>
    <div class="rules">${[
      { k: B, t: "El nombre completo, siempre. <b>Sin acrónimo público.</b> «La Bienal» se gana en conversación, no se diseña. La regla llega hasta el lector de pantalla: el <code>aria-label</code> de la marca dice el nombre entero, nunca «bBp»." },
      { k: A, t: "<b>El nombre tiene tres formaciones y un solo reparto de voces.</b> Apilado (el hero: cada slot en su línea, el viewport entero), en losa (la tesis: las tres voces dentro de una frase) y al hilo (el pie: wordmark horizontal, baja de renglón sólo cuando no entra). Pixel en los slots fijos, serif en el variable — en las tres." },
      { k: B, t: "Un solo nombre para ES y EN. No hay lockup espejo ni regla de precedencia. Sólo la bajada y la línea de pie se traducen." },
      { k: B, t: "La línea de pie, verbatim: «" + C.lockup.es.pie + "» / «" + C.lockup.en.pie + "». Los separadores no se cambian." },
      { k: B, t: "Los <b>dos registros</b> de la bajada existen y son distintos. Público: «" + C.bajada.publico.linea + "». Institucional: «" + C.bajada.institucional.linea + "». No son la misma frase en dos idiomas." },
      { k: B, t: "El registro institucional <b>no tiene traducción aprobada al inglés</b>. No inventar una — ni siquiera en un sitio en inglés: ahí se muestra en español, con su etiqueta diciendo a quién le habla." },
      { k: B, t: "Los tres ejes van juntos y en ese orden: " + C.bajada.institucional.ejes.join(" · ") + "." },
      { k: B, t: "La línea de continuidad va en superficie, chica y en mono: «" + C.continuidad.es + "» / «" + C.continuidad.en + "». Nunca compite con el nombre." },
      { k: Cc, t: "¿Es la línea de pie parte <b>no desprendible</b> del lockup mínimo en toda aplicación? Ahí se resuelve la ambigüedad de «Punta» fuera de la región.", who: "Decide: René. Recomendación: sí. Respuesta PENDIENTE" }
    ].map(ruleHTML).join("")}</div>

    <h3 class="sub-h">La marca de dunas</h3>
    <p class="body">Dos jorobas asimétricas sobre base plana, dos veces — la duna de abajo levemente
      comprimida. El sistema tiene dos reglas escritas que una curva viola de frente (No-05 «el radio
      es cero», Sí-02 «todo borde es ángulo recto»), así que la marca no elige: <b>el perfil se
      declara una sola vez como Béziers y de ahí se emiten las dos versiones</b> — el trazo suave,
      fiel al dibujo, y el escalonado, que muestrea ese mismo perfil contra la celda del sistema.
      Si el dibujo se ajusta, las dos se mueven juntas.</p>
    <div class="marks2">
      <div class="mark-demo"><figure><div class="fr"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 59.08" fill="currentColor" role="img">
  <path d="M 0.00,24.50 C 4.00,19.00 10.00,0.60 25.00,0.60 C 35.00,0.60 40.00,15.50 50.00,18.60 C 60.00,21.60 65.00,3.40 78.00,3.40 C 91.00,3.40 101.00,16.00 110.00,22.00 C 113.00,24.50 114.50,26.50 115.50,28.00 L 0,28.00 Z"/>
  <path d="M 0.00,56.07 C 4.00,51.34 10.00,35.52 25.00,35.52 C 35.00,35.52 40.00,48.33 50.00,51.00 C 60.00,53.58 65.00,37.92 78.00,37.92 C 91.00,37.92 101.00,48.76 110.00,53.92 C 113.00,56.07 114.50,57.79 115.50,59.08 L 0,59.08 Z"/>
</svg>
</div>
        <figcaption><b>Suave</b> — fiel al dibujo. Es la que corre hoy en la barra y el pie de la landing.</figcaption></figure></div>
      <div class="mark-demo"><figure><div class="fr"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 59.08" fill="currentColor" role="img">
  <path d="M 0,28.00 L 0.00,20.00 L 5.00,20.00 L 5.00,10.00 L 10.00,10.00 L 10.00,5.00 L 15.00,5.00 L 15.00,0.00 L 30.00,0.00 L 30.00,5.00 L 35.00,5.00 L 35.00,10.00 L 40.00,10.00 L 40.00,15.00 L 45.00,15.00 L 45.00,20.00 L 55.00,20.00 L 55.00,15.00 L 60.00,15.00 L 60.00,10.00 L 70.00,10.00 L 70.00,5.00 L 90.00,5.00 L 90.00,10.00 L 100.00,10.00 L 100.00,15.00 L 105.00,15.00 L 105.00,20.00 L 110.00,20.00 L 110.00,25.00 L 115.00,25.00 L 115.00,28.00 Z"/>
  <path d="M 0,59.08 L 0.00,50.00 L 5.00,50.00 L 5.00,45.00 L 10.00,45.00 L 10.00,40.00 L 15.00,40.00 L 15.00,35.00 L 30.00,35.00 L 30.00,40.00 L 40.00,40.00 L 40.00,45.00 L 45.00,45.00 L 45.00,50.00 L 60.00,50.00 L 60.00,45.00 L 65.00,45.00 L 65.00,40.00 L 95.00,40.00 L 95.00,45.00 L 100.00,45.00 L 100.00,50.00 L 110.00,50.00 L 110.00,55.00 L 115.00,55.00 L 115.00,59.08 Z"/>
</svg>
</div>
        <figcaption><b>Escalonada</b> — el mismo perfil, resuelto en la celda: la altura se mide en el centro de cada columna, como la máscara.</figcaption></figure></div>
    </div>
    <div class="rules">${[
      { k: A, t: "Fuente única: <code>_logo/build_logo.py</code>. ViewBox <code>120 × 59.08</code> — si el perfil cambia de proporción, ese número se mueve con él y hay que perseguir sus consumidores (el alto declarado del pie)." },
      { k: B, t: "La marca va como <b>SVG inline con <code>currentColor</code></b>, nunca como <code>&lt;img&gt;</code>: hereda la tinta del contexto y se invierte sola con la barra, sin una segunda copia del archivo." },
      { k: B, t: "La marca <b>acompaña</b> al nombre, no lo reemplaza. Sola sólo donde el nombre ya está en la misma pieza (la barra, el pie)." },
      { k: A, t: "Alturas de referencia: barra <code>1.55rem</code> (<code>1.25rem</code> encogida) · pie: el alto del bloque de texto, declarado como suma de sus renglones, no medido." },
      { k: Cc, t: "Cuál emisión es canónica en qué superficie. Hoy la landing corre la suave en las dos posiciones; la escalonada existe y no tiene consumidor.", who: "Decide: René. Registrado en §16 — la tensión curva/celda es real y está a la vista" }
    ].map(ruleHTML).join("")}</div>` });

  /* ---- 09 ---- */
  SEC.push({ id: "sucesion", n: "09", t: "La <em>sucesión</em>", tt: "Sucesión", html: `
    <p class="body">La bienalidad <b>no tenía hogar estructural</b>: 2029 y 2031 aparecían en cero
      de las cinco piezas anteriores. El mecanismo es un <b>ordinal de plancha</b>: la edición vive
      en un contador, no en la palabra grande. Así la siguiente entra sin rediseñar nada.</p>
    <p class="body">El hogar se mudó una vez y vale registrar por qué: la sección «Every two years»
      de la landing tenía exactamente las mismas tres fichas que el bloque del ritmo del pie — la
      página decía dos veces lo mismo con dos maquetas. Se consolidó en el pie: el <b>sello de
      ediciones</b>, un libro mayor de tres fichas al lado del lockup, los tres años al hilo. La
      edición viva se marca <b>invirtiéndola</b> (No-02), no con una tinta. Vertical y grande le
      disputaba el peso a la marca; acostado y chico es lo que siempre fue — un sello. El pie de
      este documento lo corre en vivo.</p>
    <div class="demos">${C.ediciones.map((e, i) =>
      demo(`data-blob="void" data-seed="${101 + i * 31.4}" data-cell="12" data-fringe-cells="2.7" data-dither="${(i * 0.5).toFixed(2)}"`,
           `<b>Nº ${e.n} · ${e.anio}</b> — ${e.estado}. El dissolve crece con la distancia en el tiempo.`, CLARO)).join("")}</div>
    <div class="rules">${[
      { k: A, t: "Ordinal: <code>Nº 001</code> → <code>Nº 002</code> → <code>Nº 003</code>, en mono, tres dígitos, arriba del año." },
      { k: B, t: "El año va en el nombre y en la línea de pie. La edición no reemplaza al año." },
      { k: B, t: "Literal: " + C.ediciones.map(e => e.anio).join(" · ") + ". Ninguna pieza sugiere cadencia anual." },
      { k: B, t: "El sello de ediciones es <b>horizontal</b> y nunca compite en peso con la marca: cabe en el alto del bloque de texto del lockup." },
      { k: B, t: "La escalera de ediciones se alimenta de <b>una sola fuente</b> (<code>ediciones</code> en el copy canónico) — nunca una segunda copia de los años a mano, que se desincroniza en cuanto cambie una fecha." },
      { k: B, t: "Palabras barridas por contradecir la bienalidad: «temporada alta», «every season»." },
      { k: A, t: "Dissolve por edición: 0 la vigente, +0.5 por cada edición futura." }
    ].map(ruleHTML).join("")}</div>` });

  /* ---- 10 ---- */
  SEC.push({ id: "motion", n: "10", t: "Motion e <em>interacción</em>", tt: "Motion e interacción", html: `
    <p class="body">Una sola gramática: <b>fichas numeradas</b>. Cada ficha reposa quieta, y la
      transición interpola los vértices de la máscara entre silueta saliente y entrante — aparecen
      diagonales en el medio y al aterrizar vuelve a ser ortogonal. La diagonal existe sólo en
      tránsito; nunca en reposo.</p>
    <div class="rules">${[
      { k: A, t: "Reposo ~1.2 s. Transición ~0.35 s. Loop cerrado sobre sí mismo." },
      { k: B, t: "En reposo, cero diagonales. La diagonal es exclusiva del tránsito." },
      { k: B, t: "Dos tintas por ficha, más la inversión. Nunca tres colores en cuadro." },
      { k: B, t: "<code>prefers-reduced-motion</code>: reloj congelado y sin repintado en reposo. El hover sí repinta, porque ahí lo pide la persona." },
      { k: B, t: "El gesto del puntero cuantiza la fotografía. Es un <b>gesto</b>, no un estado: en reposo la foto va en color pleno." },
      { k: B, t: "La palabra grande puede partirse a mitad de palabra. El cuerpo es fijo; el corte es del sistema." }
    ].map(ruleHTML).join("")}</div>
    <h3 class="sub-h">El flip — la mecánica adoptada</h3>
    <p class="body">Las cinco salas del programa dan vuelta: frente con la foto entera en placa
      rectangular (§05, el modo plano) y el rótulo en plancha, dorso con el detalle y los datos,
      más un control para dar vuelta todas juntas. La mecánica y la arquitectura de información vienen de la ruta VB0.1-D. <b>Su acabado
      no vino</b>, y no por gusto: aquel deck corre píldoras de radio 999, un degradé sobre la foto
      y <code>grayscale(.35)</code> — tres choques frontales con No-05, Sí-02 y Sí-03. La
      legibilidad sobre la foto acá ya la resuelve la máscara, que es la herramienta propia.</p>
    <div class="rules">${[
      { k: B, t: "De una referencia se adopta la <b>mecánica</b>, nunca la piel. Cada rasgo del acabado ajeno se contrasta contra las reglas escritas antes de entrar." },
      { k: A, t: "Flip: <code>rotateY</code>, .75 s <code>--ease-out</code>, congelado bajo <code>prefers-reduced-motion</code>." },
      { k: B, t: "El estado del flip vive en <code>aria-pressed</code>, no en una clase: el botón ya tiene que anunciarlo para teclado y lector — una clase aparte sería el mismo estado dos veces, esperando desincronizarse." },
      { k: B, t: "El dorso se invierte <b>con el campo de la sección</b>: sobre campo claro va void; sobre campo negro va acid. La tarjeta del color exacto del fondo desaparece — el bug ya ocurrió en los dos sentidos." },
      { k: B, t: "El dorso sólo afirma lo decidido: qué pasa, qué día, en qué sede. Sin aforos, sin precios, sin «tickets open» — publicar eso sería inventar una decisión que nadie tomó." },
      { k: B, t: "La sala activa del carrusel se marca con <b>filete</b>, nunca atenuando las otras: bajar la opacidad deja pasar el campo por debajo y tiñe las fotos." }
    ].map(ruleHTML).join("")}</div>` });

  /* ---- 11 ---- */
  SEC.push({ id: "ritmo", n: "11", t: "El <em>ritmo</em>", tt: "Ritmo", html: `
    <p class="body">Un sitio no se compone sección por sección: se compone por
      <b>amplitud</b>. La ley, leída de la referencia viewport por viewport, es que
      <b>dos picos nunca se tocan</b>. Cada pico tipográfico viene precedido por un valle
      editorial, y el valle más plano —una secuencia densa— cae justo antes del pico más alto.
      La amplitud del pico se la gana la chatura que viene antes. En la landing vigente el orden
      es literal: el programa (valle largo, carrusel de baja varianza) viene <b>antes</b> que la
      tesis (el pico).</p>
    <table class="tk"><thead><tr><th>Registro</th><th>Instrumento</th><th>Regla</th></tr></thead><tbody>
      <tr><td><b>Pico</b></td><td>Losa: una frase, cuerpo enorme, las tres voces del lockup</td><td>Nunca dos seguidas. Nunca más de tres en todo el sitio.</td></tr>
      <tr><td><b>Valle</b></td><td>Secuencia sostenida de baja varianza — el programa, con su barra de pasos</td><td>Al menos un valle largo antes de cada pico.</td></tr>
      <tr><td><b>Meseta</b></td><td>Cabezal y contenido: la sección normal</td><td>El default. Sin dos picos alrededor.</td></tr>
    </tbody></table>
    <div class="rules">${[
      { k: B, t: "Dos losas nunca son consecutivas." },
      { k: B, t: "Toda losa lleva copy <b>público</b> y verbatim. La adenda de la prueba de decisión no califica: contiene el sustantivo prohibido." },
      { k: A, t: "La losa corre las <b>tres voces del lockup</b> — pixel en los slots fijos, serif en el del tema («The first and only <em>blockchain</em> biennial.») — con escala propia: <code>clamp(1.7rem, 5.4vw, 4.6rem)</code> pixel · <code>clamp(2.6rem, 8.4vw, 7.4rem)</code> serif. No reusa <code>--t-formato/--t-tema</code>: el hero tiene el viewport entero, la losa convive con su línea de pie dentro de una plancha." },
      { k: A, t: "La losa va <b>centrada de verdad</b>: <code>text-align: center</code> centra las líneas dentro de la cita, y <code>margin-inline: auto</code> centra la caja (que topa en <code>max-width: 15ch</code>). Las dos cosas, no una." },
      { k: A, t: "Alto de losa: <code>82svh</code>. Una sección de 100svh con 409px de contenido deja casi la mitad en blanco, y ese aire lee como error de maquetación, no como respiro." },
      { k: B, t: "La retícula de celda va sobre la plancha de la losa (opacidad .17) — es el caso «siempre» de §04." },
      { k: B, t: "La barra de pasos se ancla al pie del viewport mientras la sección desfila, invertida con el campo de la sección. Recorrido en masa tenue, activo en caja invertida." },
      { k: B, t: "Las secciones se numeran sin huecos. Cuando una sección se retira (la ex-§08), la numeración se cierra — un salto en los ordinales delata la cirugía." },
      { k: Cc, t: "Dónde cae cada pico y qué frase se gana una losa.", who: "Decide: dirección de arte, con René en el sign-off de copy" }
    ].map(ruleHTML).join("")}</div>` });

  /* ---- 12 ---- */
  SEC.push({ id: "voz", n: "12", t: "Voz y las dos <em>lenguas</em>", tt: "Voz y las dos lenguas", html: `
    <p class="body">Precisa, no promocional. Estructurada, no inflada. Institucional, no
      corporativa. Declarativas cortas; los fragmentos se aceptan. La cultura no se declara,
      se ejerce.</p>
    <div class="dd">
      <div class="si"><h4>Palabras del sistema</h4><ul>
        <li>estructural · opcionalidad · plataforma · institucional · ambas · en construcción</li>
        <li>«Es una bienal, no un summit anual.» El molde: afirmación, coma, negación.</li></ul></div>
      <div class="no"><h4>Nunca aparecen — chequeo binario</h4><ul>
        <li>${C.prohibido.palabras.map(w => "<b>" + w + "</b>").join(" · ")}</li>
        <li>«Legitimacy arrives before proof» — un banco central lo lee como aval previo a la prueba.</li>
        <li>«Davos de América Latina», «el Biarritz del Cono Sur», y toda construcción «el X de Y».</li>
        <li>«Leaders Forum» · «Institutional Summit» — las salas usan sus nombres del canon.</li>
        <li>Nombres superados: ${C.prohibido.nombresSuperados.join(" · ")}.</li></ul></div>
    </div>
    <div class="rules">${[
      { k: B, t: "El <b>sustantivo</b> «cultura» no aparece en ninguna pieza. El <b>adjetivo</b> «cultural» sí: el propio canon §5 escribe «prensa cultural» en la misma sección donde prohíbe el sustantivo. Un chequeo por substring marca esa línea verbatim como violación — el chequeo va con límite de palabra." },
      { k: B, t: "La única línea de continuidad sancionada es: «" + C.prohibido.continuidadSancionada + "». Ninguna otra mención del nombre viejo." },
      { k: B, t: "Nada que el BCU o el MEF no pudieran co-firmar: sin encuadre de ganancia especulativa, sin imaginería de precio o token, sin registro degen." },
      { k: Cc, t: "El registro de amenaza de la bajada no se puede perder al barrer copy: «oportunidades <b>y amenazas</b>».", who: "Decide: René, en el sign-off de copy" }
    ].map(ruleHTML).join("")}</div>
    <h3 class="sub-h">La capa en inglés</h3>
    <p class="body">La landing corre en inglés desde el 2026-08-27. El inglés es una <b>capa
      paralela, no un reemplazo</b>: el español del copy canónico es la capa verbal cerrada
      (2026-08-26), material verbatim del vault — borrarlo destruiría el original sancionado, que
      es la única versión que BCU, MEF y Presidencia pueden leer.</p>
    <div class="rules">${[
      { k: B, t: "El registro institucional se muestra <b>en español</b> incluso en superficie inglesa, con su etiqueta diciendo a quién le habla. Si hace falta un inglés, lo escribe René — no se inventa." },
      { k: B, t: "Los decimales cambian con la lengua: <code>42,5</code> en español, <code>42.5</code> en inglés — «42,5» en inglés se lee cuatrocientos veinticinco." },
      { k: B, t: "Ninguna cadena de superficie se escribe a mano en una pieza: todo sale del copy canónico (<code>content.js</code>), incluida la capa <code>en</code>." },
      { k: B, t: "<b>Ningún número inventado sin sello.</b> Todo dato sin fuente citable lleva el rótulo «Mock» a la vista, en la ficha, no en una nota. Un tablero de cifras plausibles sin marca es indistinguible de uno real — y una pieza institucional puede mostrar <em>un</em> dato provisorio, no un tablero mayormente provisorio: el tablero se recortó de nueve fichas a seis para bajar de tres sellos a uno." },
      { k: Cc, t: "El copy nuevo de los dorsos de sala (salaDetalle) está redactado y sin firmar.", who: "Firma: René. Hasta entonces es propuesta, no canon" }
    ].map(ruleHTML).join("")}</div>` });

  SEC.push({ id: "canal", n: "13", t: "Aplicación por <em>canal</em>", tt: "Aplicación por canal", html: `
    <table class="tk"><thead><tr><th>Canal</th><th>Formato</th><th>Reglas propias</th></tr></thead><tbody>
      <tr><td>Web</td><td class="m">responsive</td><td>Celda del ancho del viewport. Sin scroll horizontal. La barra es plancha void con el nav <b>centrado</b> en retícula de tres columnas; la marca de dunas a la izquierda, en <code>currentColor</code>; el pie de barra se retira antes que el nav (metadato cede ante navegación).</td></tr>

      <tr><td>Social — vertical</td><td class="m">1080×1350</td><td>Ficha de motion congelada. Índice arriba, crédito al borde.</td></tr>

      <tr><td>Programa — web</td><td class="m">100svh</td><td>Las cinco salas entran en <b>un viewport</b> y desfilan en horizontal, con snap y flip (§10). La foto va <b>entera en placa rectangular</b> (<code>data-plain</code>), sin máscara. La barra de pasos es el <b>índice</b>: se clickea y sigue el scroll. La activa se marca con filete. El hover trae la foto de la sala desenfocada como fondo — gesto, no estado.</td></tr>
      <tr><td>Programa — impreso</td><td class="m">4:5</td><td>Mono para todo lo que informa. Una masa por sesión.</td></tr>
      <tr><td>Tablero de datos</td><td class="m">web · deck</td><td>Planchas de máscara (§02), paleta editorial scopeada (§06), sello «Mock» a la vista en todo dato sin fuente (§12). Gráfico: barras bloque de esquina viva, etiqueta directa sobre la barra (con cuatro barras el tooltip es redundante), <code>min-height</code> para que la barra corta siga midiendo como barra.</td></tr>
      <tr><td>Print / papelería</td><td class="m">A3 · A2</td><td><b>Modo fondo claro</b> (<code>--paper</code>). Colores exactos, y la máscara se recalcula en <code>beforeprint</code>.</td></tr>

    </tbody></table>

    <h3 class="sub-h">Merchandising — el arte de la bolsa</h3>
    <p class="body">La única aplicación que corre en <b>modo fondo claro</b>. La lona es cruda, el
      wordmark se repite hasta llenar el frente, y la masa se genera encima con el bloque de datos
      adentro. La masa no se dibuja para la bolsa: la genera el mismo algoritmo, midiendo el bloque
      de datos real. Cambia el texto y la mancha se recorta sola.</p>
    <p class="body"><b>El mockup es dibujado, no fotográfico.</b> Lona, asas y pliegue son vector, así
      que la pieza no finge una foto de producto que todavía no existe — pero muestra lo que el arte
      plano escondía: dónde cae la masa respecto de las asas y cuánto se pierde en el doblez lateral.

                <b>${C.nombre.completo}</b>
                <b>${C.bajada.publico.linea}</b>
                <b>${C.lockup.es.pie}</b>
              </div>
              <div class="marks"><span>${sala}</span><span>Nº 001</span></div>
            </div>
          </div>
          <figcaption>Bolsa de lona · 380 × 420 mm · una tinta · lona cruda u olivo<br>
            Masa ${k === "acid" ? "clara sobre olivo, datos en tinta" : "en tinta sobre crudo, datos en claro"} — la inversión, no una tercera tinta</figcaption>
        </figure>
      </div>`).join("")}
    </div>
    <div class="rules">${[
      { k: A, t: "Frente 380 × 420 mm. El wordmark repetido ocupa el alto completo; la masa se centra sobre el tercio medio." },

    ].map(ruleHTML).join("")}</div>
    <div class="rules">${[
      { k: B, t: "Una sola acción por pieza. Sobre ácido va en masa; sobre masa va en ácido." },
      { k: B, t: "El inventario de Casa Manantial <b>nunca se pricea</b>. Cena y fiesta aparecen sólo como «incluido»." },
      { k: B, t: "Sin precios públicos de sponsorship ni de tickets, y sin conteo de posiciones por tier: las fuentes internas no coinciden entre sí." },

  SEC.push({ id: "pie", n: "14", t: "El <em>pie</em>", tt: "El pie", html: `
    <p class="body">El pie es una pieza, no un apéndice. Tres zonas: <b>A</b> un directorio denso de
      columnas — encabezado diminuto en mono versalitas, filas de enlaces en la voz display debajo;
      <b>B</b> el lockup a escala, con la marca de dunas compartiendo piso y techo con el bloque de
      texto, y el sello de ediciones a su derecha; <b>C</b> una línea de letra chica centrada al
      cierre. De la referencia que lo originó se tomó la <b>estructura</b>; la piel no — la tarjeta
      con radio la prohíbe No-05 y el degradado a tres tintas lo prohíbe No-02.</p>
    <p class="body"><b>El pie de este documento corre el patrón en vivo</b> — es el demo.</p>
    <div class="rules">${[
      { k: B, t: "El directorio se arma <b>desde el mismo contenido que alimenta las secciones</b> — salas, agenda, personas, razones. Ninguna etiqueta se escribe dos veces: si algo cambia arriba, cambia solo abajo. Y cada entrada apunta a un ancla que existe: ningún destino inventado." },
      { k: B, t: "Los créditos son una columna del directorio, no una fila suelta al pie." },
      { k: B, t: "Encabezados en mono versalitas; filas en la voz display y caja de frase. Usar mono también en las filas aplana la jerarquía que ese contraste sostiene." },
      { k: B, t: "<b>El pie va todo en el mismo negro.</b> La franja del lockup tuvo <code>--quiet</code> un rato y se sacó: la separación la hacen el aire y la regla de la letra chica, no un cambio de tono." },
      { k: A, t: "El wordmark del pie corre al <b>60 % de la escala de titular</b> (<code>clamp(1.05rem, 3.1vw, 2.58rem)</code>): más grande lee como titular de sección, no como pie. La bajada baja con él; la línea de lugar y fecha <b>no</b> — a .6 de <code>--t-micro</code> deja de ser legible y pasa a ser textura." },
      { k: A, t: "La marca comparte piso y techo con el bloque de texto: su alto es la <b>suma declarada</b> de los tres renglones y sus gaps (<code>--f-h</code>), nunca una medición — y saca su ancho de <code>aspect-ratio: 120 / 59.08</code>. Si se toca una línea, se toca la cuenta." },
      { k: A, t: "Colapso responsive: por debajo de 1000px el sello baja debajo del lockup, a lo ancho; por debajo de 640px la marca vuelve a tener alto propio — apilados, «mismo piso y techo» no quiere decir nada." },
      { k: B, t: "El sello de ediciones vive en la franja del lockup, acostado — no en el directorio, donde vertical y a escala le disputaba el peso a la marca." }
    ].map(ruleHTML).join("")}</div>` });
