<meta name="description" content="Bienal Blockchain Punta 2027 — one-page onboarding sheet. The thesis, what it is and is not, why Punta del Este, the signal, the agenda, the five rooms, who sits at the table, the rhythm of editions and what is not decided. Same copy and same system as the V0.3.0 «Blanco» site, on one A4 page.">
<style>
/* ===========================================================================
   Bienal Blockchain Punta — tokens del sistema V0.3.0 "Máscaras"
   ---------------------------------------------------------------------------
   UNA hoja de tokens. Antes los valores vivían en cuatro representaciones sin
   ningún vínculo: hex en CSS, vec3 en GLSL, strings en JS y rgba() inline. Y
   dos azules distintos se llamaban los dos "sky" (#7FC3EE en el hero,
   #1E8FE0 en la hoja). Se reconcilian acá.

   El companion CSS publicado vive en templates/themes/bienal-punta.css y se
   genera de este archivo — es el hook de propagación de dirección de arte.
   =========================================================================== */
:root{
  /* --- tintas: DOS, más la fotografía como único tono medio -------------- */
  --acid:    #C8F52D;   /* ink 01 — campo dominante. Nunca acento suelto */
  --void:    #12140F;   /* ink 02 — casi negro con sesgo verde */
  --acid-d:  #A5CE1E;   /* ácido oscurecido — sólo estados :active */
  --quiet:   #1D2016;   /* tercer VALOR, no tercera tinta: masa negra sobre
                           negro, legible sólo como textura (etherfuse) */
  --paper:   #F4F1E8;   /* modo fondo claro — print y papelería */
  --sky-mid: #7FC3EE;   /* el tono medio propio del cielo, nunca un gris */

  /* --- tipografía: cuatro familias, cada una con su trabajo -------------- */
  --disp:  "Archivo", "Helvetica Neue", Arial, sans-serif;
  --pixel: "Handjet", "Archivo", monospace;          /* slots FIJOS del nombre */
  --tema:  "Instrument Serif", Georgia, serif;       /* slot VARIABLE del nombre */
  --mono:  "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  /* escala display — las tres voces del nombre, en el orden del canon:
     BIENAL (pixel) · Blockchain (serif itálica, slot variable) · PUNTA 2027
     (pixel). Topes bajados respecto de VB0.1-B (258 px) porque acá el bloque
     conviven con eyebrow, pie y una segunda columna: a 258 px el nombre se
     salía del primer viewport. */
  --t-formato: clamp(30px, 6.6vw, 92px);
  --t-tema:    clamp(46px, 10.4vw, 158px);
  --t-lugar:   clamp(38px, 8.2vw, 118px);
  /* escala general */
  --t-display: clamp(1.9rem, 5.4vw, 4.9rem);
  --t-h2:      clamp(1.05rem, 2vw, 1.5rem);
  --t-sub:     clamp(1rem, 1.9vw, 1.35rem);
  --t-lead:    clamp(.95rem, 1.55vw, 1.22rem);
  --t-body:    .93rem;
  --t-mono:    .74rem;
  --t-lbl:     clamp(.58rem, .95vw, .68rem);
  --t-micro:   .6rem;

  /* --- ritmo -------------------------------------------------------------- */
  --pad:   clamp(1rem, 2.8vw, 2.2rem);
  --sheet: 1180px;
  --hair:  1px;
  --rule:  1px solid rgba(18, 20, 15, .26);

  /* --- curvas nombradas: TF3 pedía beziers, no palabras clave ------------- */
  --ease-out:  cubic-bezier(.22, .61, .36, 1);
  --ease-step: cubic-bezier(.85, 0, .15, 1);   /* para lo que debe leerse duro */
  --ease-in:   cubic-bezier(.55, .06, .68, .19);
}

/* El radio del sistema es cero. No es una preferencia, es la regla No-05. */
*, *::before, *::after{ border-radius: 0; }


/* =========================================================================
   ONE-PAGER · onboarding V0.1.0 — variante «Blanco» nativa
   -------------------------------------------------------------------------
   La misma pieza que el deck, apretada en UNA hoja A4 vertical (794 × 1123 px
   a 96 dpi: la pantalla y el papel miden lo mismo, así lo que se ve es lo que
   se imprime). Mismos tokens, mismo copy (content.js), misma máscara (mask.js).
   ========================================================================= */
:root{
  --acid:   #FFFFFF;
  --acid-d: #D8D8D2;
  --campo:  #7B7C6C;
  --c-peri:  #969DDA; --c-tan: #C6AB7E; --c-red: #E8503F; --c-sage: #9FB185;
  --pw: 794px; --ph: 1123px; --m: 30px;
  --fs: .62rem;          /* cuerpo de hoja */
}
*, *::before, *::after{ border-radius: 0; box-sizing: border-box; }
body{
  margin: 0; background: var(--campo); color: var(--void);
  font-family: var(--disp); font-weight: 600; font-size: var(--fs);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  display: grid; place-items: start center; padding: clamp(1rem, 4vh, 3rem) 1rem;
}
.page{
  position: relative; width: var(--pw); height: var(--ph); background: var(--acid);
  overflow: hidden; isolation: isolate; display: grid;
  grid-template-rows: auto auto auto auto auto; gap: 9px;
  padding: 0 var(--m) 22px;
}
/* las cuatro tintas por las esquinas, como en §03 del sitio — el campo de la hoja */
.page::before{
  content: ""; position: absolute; inset: 0; z-index: -1;
  background:
    radial-gradient(52% 40% at 0% 30%,   color-mix(in srgb, var(--c-peri) 46%, transparent) 0%, transparent 74%),
    radial-gradient(50% 36% at 100% 28%, color-mix(in srgb, var(--c-tan) 44%, transparent) 0%, transparent 76%),
    radial-gradient(52% 34% at 0% 100%,  color-mix(in srgb, var(--c-sage) 46%, transparent) 0%, transparent 76%),
    radial-gradient(40% 28% at 100% 100%, color-mix(in srgb, var(--c-red) 28%, transparent) 0%, transparent 74%);
}
.regmarks{ position: absolute; inset: 10px; pointer-events: none; z-index: 5; }
.regmarks i{ position: absolute; width: 11px; height: 11px; opacity: .85; }
.regmarks i::before, .regmarks i::after{ content: ""; position: absolute; background: var(--void); }
.regmarks i::before{ left: 50%; top: 0; width: 1px; height: 100%; transform: translateX(-50%); }
.regmarks i::after{ top: 50%; left: 0; height: 1px; width: 100%; transform: translateY(-50%); }
.regmarks i:nth-child(1){ left: 0; top: 0; } .regmarks i:nth-child(2){ right: 0; top: 0; }
.regmarks i:nth-child(3){ left: 0; bottom: 0; } .regmarks i:nth-child(4){ right: 0; bottom: 0; }

/* ---------- tipografía de hoja ---------- */
.k{ display: block; font-family: var(--mono); font-size: .5rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; opacity: .72; }
.mono{ font-family: var(--mono); font-weight: 600; font-size: .5rem; letter-spacing: .14em; text-transform: uppercase; }
.h{ display: flex; align-items: baseline; gap: .6rem; border-top: 1.5px solid var(--void); padding-top: .3rem; margin-bottom: .45rem; }
.h h2{ margin: 0; font-size: .74rem; font-weight: 900; letter-spacing: -.02em; text-transform: uppercase; line-height: 1; }
.h h2 em{ font-family: var(--tema); font-style: italic; font-weight: 400; text-transform: none; letter-spacing: -.01em; font-size: 1.34em; line-height: .9; }
.h .num{ margin-left: auto; font-family: var(--pixel); font-weight: 800; font-size: .85rem; letter-spacing: .05em; line-height: 1; }
p{ margin: 0; }
.txt{ font-size: var(--fs); line-height: 1.42; font-weight: 500; }
ul{ list-style: none; margin: 0; padding: 0; }

/* ---------- 1 · cabecera: la portada, en franja ---------- */
.hero{
  position: relative; margin: 0 calc(var(--m) * -1); height: 196px; background: var(--void); overflow: hidden;
  background-image: var(--bg); background-size: cover; background-position: center;
}
.hero canvas{ position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .fields{ position: absolute; inset: 0; padding: 18px var(--m) 16px; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: end; gap: 14px; }
.boxA, .boxB{ position: relative; width: fit-content; max-width: 100%; padding: 12px 14px 13px; display: grid; gap: 5px; }
.boxA{ color: var(--void); } .boxB{ color: var(--acid); }
.eyebrow{ font-family: var(--mono); font-weight: 600; font-size: .5rem; letter-spacing: .17em; text-transform: uppercase; }
h1{ margin: 0; line-height: .84; text-transform: uppercase; }
h1 .fmt{ display: block; font-family: var(--pixel); font-weight: 800; font-size: 26px; letter-spacing: .04em; line-height: .9; }
h1 .tema{ display: block; font-family: var(--tema); font-style: italic; font-weight: 400; font-size: 46px; letter-spacing: -.012em; line-height: .9; margin-top: -.04em; text-transform: none; }
h1 .place{ display: block; font-family: var(--pixel); font-weight: 800; font-size: 34px; letter-spacing: .03em; line-height: .86; margin-top: -.03em; }
.cont{ font-family: var(--mono); font-size: .48rem; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; opacity: .62; }
.lead{ font-size: .86rem; font-weight: 600; letter-spacing: -.006em; line-height: 1.22; }
.en{ font-family: var(--mono); font-weight: 400; font-size: .5rem; letter-spacing: .12em; text-transform: uppercase; opacity: .84; }
.prom{ font-size: .64rem; font-weight: 600; line-height: 1.3; max-width: 40ch; }
.coord{ font-family: var(--mono); font-weight: 600; font-size: .5rem; letter-spacing: .18em; opacity: .82; }
.tag{ border-top: 1px solid currentColor; padding-top: 5px; margin-top: 2px; font-family: var(--mono); font-weight: 600; font-size: .48rem; letter-spacing: .14em; text-transform: uppercase; opacity: .72; }

/* ---------- 2 · tesis + posicionamiento ---------- */
.pos{ display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px; align-items: center; padding-top: 4px; }
.pos q{ display: block; quotes: none; }
.pos q .v-pix{ display: block; font-family: var(--pixel); font-weight: 800; font-size: 1.15rem; letter-spacing: .035em; line-height: .9; text-transform: uppercase; }
.pos q .v-tema{ display: block; font-family: var(--tema); font-style: italic; font-weight: 400; font-size: 1.9rem; letter-spacing: -.012em; line-height: .88; margin: -.02em 0; }
.pos .attr{ margin-top: .45rem; font-family: var(--mono); font-weight: 600; font-size: .48rem; letter-spacing: .16em; text-transform: uppercase; opacity: .7; }
.pos .plancha{ background: var(--void); color: var(--acid); padding: 10px 13px 11px; font-size: .8rem; line-height: 1.3; font-weight: 600; }

/* ---------- 3 · 4 · las dos filas de tres ---------- */
.row3{ display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-content: start; }
.col{ min-width: 0; display: grid; align-content: start; }
.list li{ display: grid; grid-template-columns: 1.1rem minmax(0, 1fr); gap: .45rem; align-items: baseline; padding: .28rem 0; border-top: 1px solid rgba(18, 20, 15, .18); }
.list li:first-child{ border-top: none; padding-top: 0; }
.list .n{ font-family: var(--pixel); font-weight: 800; font-size: .8rem; line-height: 1; letter-spacing: .04em; }
.list .t{ display: block; font-weight: 900; font-size: .66rem; letter-spacing: -.012em; line-height: 1.12; }
.list .t.i{ font-family: var(--tema); font-style: italic; font-weight: 400; font-size: .84rem; letter-spacing: -.01em; }
.list .d{ display: block; font-size: .55rem; font-weight: 500; line-height: 1.36; margin-top: .12rem; }
/* la señal: tres números en la voz pixel, con fuente */
.stats{ display: grid; gap: .35rem; }
.stat{ display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .6rem; align-items: baseline; padding: .3rem 0; border-top: 1px solid rgba(18, 20, 15, .18); }
.stat:first-child{ border-top: none; padding-top: 0; }
.stat .v{ font-family: var(--pixel); font-weight: 800; font-size: 1.7rem; line-height: .82; letter-spacing: .01em; }
.stat .u{ font-family: var(--mono); font-size: .48rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.stat .d{ display: block; font-size: .55rem; font-weight: 500; line-height: 1.3; margin-top: .1rem; }
.lectura{ margin-top: .45rem; background: var(--void); color: var(--acid); padding: .5rem .6rem; font-size: .6rem; line-height: 1.34; }
.src{ margin-top: .35rem; font-family: var(--mono); font-size: .46rem; letter-spacing: .1em; text-transform: uppercase; opacity: .62; }
/* las salas: tabla compacta */
.rooms{ display: grid; gap: 0; }
.room{ display: grid; grid-template-columns: 1.1rem minmax(0, 1fr) auto; gap: .45rem; align-items: baseline; padding: .3rem 0; border-top: 1px solid rgba(18, 20, 15, .18); }
.room:first-child{ border-top: none; padding-top: 0; }
.room .n{ font-family: var(--pixel); font-weight: 800; font-size: .8rem; line-height: 1; }
.room .es{ font-weight: 900; font-size: .66rem; letter-spacing: -.012em; }
.room .es em{ font-family: var(--tema); font-style: italic; font-weight: 400; font-size: 1.22em; letter-spacing: -.01em; }
.room .d{ display: block; font-size: .56rem; font-weight: 500; line-height: 1.34; margin-top: .1rem; }
.room .meta{ font-family: var(--mono); font-size: .44rem; letter-spacing: .1em; text-transform: uppercase; opacity: .7; text-align: right; white-space: nowrap; line-height: 1.35; }
.axes{ display: flex; flex-wrap: wrap; gap: .3rem; margin: .4rem 0 .5rem; }
.axes li{ font-family: var(--mono); font-size: .46rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; padding: .38em .6em; background: var(--void); color: var(--acid); }
.people .t{ font-size: .66rem; }

/* ---------- 5 · el pie: destino, ediciones, lo no decidido, lockup ---------- */
.foot{ display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; border-top: 1.5px solid var(--void); padding-top: 8px; }
.eds{ display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; background: var(--void); border: 2px solid var(--void); margin-top: .3rem; }
.ed{ background: var(--acid); color: var(--void); padding: .38rem .45rem .42rem; display: grid; gap: .08rem; }
.ed--now{ background: var(--void); color: var(--acid); }
.ed .ord{ font-family: var(--mono); font-size: .42rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .72; }
.ed .yr{ font-family: var(--pixel); font-weight: 800; line-height: .9; font-size: 1.15rem; letter-spacing: .02em; }
.ed .st{ font-family: var(--mono); font-size: .4rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .72; }
.ritmo{ margin-top: .4rem; font-weight: 900; font-size: .72rem; letter-spacing: -.02em; text-transform: uppercase; line-height: 1; }
.ritmo em{ font-family: var(--tema); font-style: italic; font-weight: 400; text-transform: none; font-size: 1.2em; letter-spacing: -.01em; }
.inst{ margin-top: .4rem; display: inline-block; background: var(--void); color: var(--acid); padding: .36em .6em; font-family: var(--mono); font-size: .46rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.nd li{ font-size: .55rem; font-weight: 500; line-height: 1.36; padding-left: .8rem; position: relative; margin-bottom: .28rem; }
.nd li::before{ content: ""; position: absolute; left: 0; top: .45em; width: .3rem; height: .3rem; background: currentColor; }
.nd li b{ font-weight: 700; }
.cta{ display: inline-flex; align-items: center; gap: .6em; width: fit-content; margin-top: .35rem; font-family: var(--mono); font-weight: 600; font-size: .5rem; letter-spacing: .16em; text-transform: uppercase; padding: .7em 1em; border: 1px solid var(--void); background: var(--void); color: var(--acid); text-decoration: none; }
.cta::after{ content: "\00BB"; font-size: 1.15em; line-height: 0; }
.lock{ display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .7rem; align-items: center; }
.lock .mark{ display: block; height: 40px; aspect-ratio: 120 / 59.08; }
.lock .mark svg{ display: block; width: 100%; height: 100%; }
.lock .name{ display: flex; flex-wrap: wrap; align-items: baseline; column-gap: .18em; font-size: .92rem; line-height: .9; }
.lock .name .pix{ font-family: var(--pixel); font-weight: 800; letter-spacing: .035em; text-transform: uppercase; }
.lock .name .tema{ font-family: var(--tema); font-style: italic; font-weight: 400; font-size: 1.16em; letter-spacing: -.012em; }
.lock .baj{ font-size: .6rem; font-weight: 600; line-height: 1.25; margin-top: .2rem; }
.lock .pie{ font-family: var(--mono); font-weight: 600; font-size: .46rem; letter-spacing: .15em; text-transform: uppercase; opacity: .68; margin-top: .15rem; }
.fine{ margin-top: .55rem; font-family: var(--mono); font-size: .44rem; letter-spacing: .1em; text-transform: uppercase; opacity: .55; line-height: 1.6; }

@media print{
  @page{ size: A4 portrait; margin: 0; }
  body{ background: #fff; padding: 0; display: block; }
  .page{ width: 210mm; height: 297mm; margin: 0; }
  *{ -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>

<script>
/* ===========================================================================
   Bienal Blockchain Punta — motor de máscara
   ---------------------------------------------------------------------------
   UNA implementación del algoritmo, consumida por el hero, la hoja de sistema,
   la landing, las guidelines y el render de motion.

   Antes de esto el algoritmo existía dos veces, en dos lenguajes, y los hashes
   NO coincidían: GLSL usaba hash21 (Hoskins, fract de 3 vectores) y el canvas
   usaba sin()*43758.5453. Todas las demás constantes eran idénticas, así que el
   hero y la hoja producían grano distinto con la misma semilla mientras la hoja
   afirmaba correr "el mismo algoritmo". Se unifica en hash21.

   La regla madre: TODO se decide en el centro de la celda. Por eso el borde
   sólo puede escalonar en ángulo recto, y esa escalera es todo el lenguaje.
   =========================================================================== */
(function (root) {
  "use strict";

  /* --- ruido: paridad byte-a-byte con mask.frag.glsl --------------------- */

  /* GLSL corre float32 y JS float64. Sin fround el ruido divergía en el sexto
     decimal, y una celda de borde podía volcar — así que "el mismo algoritmo"
     no era literalmente cierto. Con fround en cada operación sí lo es, y la
     paridad se verifica en navegador (motion/parity-test.html), no se afirma. */
  const f = Math.fround;
  const fract = (x) => f(x - Math.floor(x));

  function hash21(px, py) {
    const a = fract(f(px * 0.1031));
    const b = fract(f(py * 0.1031));
    let x = a, y = b, z = a;                       // vec3(p.xyx)
    const d = f(f(f(x * f(y + 33.33)) + f(y * f(z + 33.33))) + f(z * f(x + 33.33)));
    x = f(x + d); y = f(y + d); z = f(z + d);
    return fract(f(f(x + y) * z));
  }

  function vnoise(px, py) {
    const ix = Math.floor(px), iy = Math.floor(py);
    let fx = fract(f(px)), fy = fract(f(py));
    fx = f(f(fx * fx) * f(3 - f(2 * fx)));
    fy = f(f(fy * fy) * f(3 - f(2 * fy)));
    const a = hash21(ix, iy),     b = hash21(ix + 1, iy);
    const c = hash21(ix, iy + 1), d = hash21(ix + 1, iy + 1);
    const ab = f(a + f(f(b - a) * fx));
    const cd = f(c + f(f(d - c) * fx));
    return f(ab + f(f(cd - ab) * fy));
  }

  function fbm(px, py) {
    return f(f(f(vnoise(px, py) * 0.62)
             + f(vnoise(f(f(px * 2.13) + 7.3), f(f(py * 2.13) + 7.3)) * 0.26))
             + f(vnoise(f(f(px * 4.37) + 3.1), f(f(py * 4.37) + 3.1)) * 0.12));

  /* distancia firmada a un rectángulo, negativa adentro.
     frounded igual que el resto: GLSL usa length(), que es float32, y sin esto
     quedaban ~6 celdas de borde volcando entre los dos motores. */
  function boxDist(px, py, r) {
    const qx = f(Math.abs(f(px - f(r.x + f(r.w / 2)))) - f(r.w / 2));
    const qy = f(Math.abs(f(py - f(r.y + f(r.h / 2)))) - f(r.h / 2));
    const mx = qx > 0 ? qx : 0, my = qy > 0 ? qy : 0;
    const len = f(Math.sqrt(f(f(mx * mx) + f(my * my))));
    const inner = Math.min(Math.max(qx, qy), 0);
    return f(len + inner);
  }

  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

  /* --- dither ordenado (Bayer) -------------------------------------------
     La única forma que tiene este sistema de desvanecer sin dejar de ser
     duro. Umbral fijo comparado contra la distancia firmada de la máscara:
     cae dentro de la regla del centro de celda, así que el desvanecido
     escalona igual que el borde. Ver el póster Dgtl 20X y Camer Studio.   */

  const BAYER8 = (() => {
    const m = new Float32Array(64);
    for (let y = 0; y < 8; y++) {
      for (let x = 0; x < 8; x++) {
        let v = 0, mask = 4, xc = x, yc = y;
        for (let bit = 0; bit < 3; bit++, mask >>= 1) {
          const bx = (xc & mask) ? 1 : 0, by = (yc & mask) ? 1 : 0;
          v = (v << 2) | ((bx ^ by) << 1) | by;
        }
        m[y * 8 + x] = (v + 0.5) / 64;
      }
    }
    return m;
  })();

  const bayer = (c, r) => BAYER8[(((r % 8) + 8) % 8) * 8 + (((c % 8) + 8) % 8)];

  /* --- el núcleo: una retícula de ocupación ------------------------------
     Se calcula la ocupación booleana por celda ANTES de dibujar. Eso es lo
     que permite que relleno, filete, trama de puntos, knockout y dissolve
     salgan todos de la misma decisión, en vez de ser cinco caminos.        */

  /* --- campo de ruido cacheado -------------------------------------------
     El ruido de una celda NO depende del puntero ni del tiempo: sólo de la
     celda, la semilla y el tamaño de celda. Cacheándolo, un repintado
     interactivo cuesta un clamp y un boxDist por celda en vez de tres vnoise
     (doce hash21). Eso es lo que permite que la pieza corra a 60 fps en canvas
     2D y que NO haga falta WebGL en ninguna superficie — con lo cual el hero
     y la hoja no pueden divergir, porque son el mismo código. */

  const fieldCache = new Map();

  function noiseField(w, h, cell, seed) {
    const key = w + "|" + h + "|" + cell + "|" + seed;
    let fd = fieldCache.get(key);
    if (fd) return fd;
    const ox = -cell, oy = -cell;
    const cols = Math.ceil((w - ox) / cell) + 1;
    const rows = Math.ceil((h - oy) / cell) + 1;

      const cy = f(f(oy + f(r * cell)) + f(cell / 2));

  function grid(o) {
    const cell   = o.cell;
    const fringe = o.fringe !== undefined ? o.fringe : cell * 3.2;
    const seed   = o.seed || 0;
    const erode  = o.erode || 0;
    const dither = o.dither || 0;
    const rects  = o.rects || [];

    const fd = noiseField(o.w, o.h, cell, seed);
    const ox = fd.ox, oy = fd.oy, cols = fd.cols, rows = fd.rows;
    const on = new Uint8Array(cols * rows);

    const fdHole = (o.mode === "knockout")

    /* reach de una celda contra un conjunto de cajas: el ruido se muestrea
       en la retícula gruesa (una lóbula cada 4-5 celdas) — es lo que hace
       que el borde lea como una forma con miembros y no como un rectángulo
       con una capa de pintura rasposa */

      if (!boxes.length) return -Infinity;
      const n = src.n[idx];
      const reach = f(fr * clamp(f(f(n * 1.95) - 0.47), -0.20, 1.25));
      let d = Infinity;
      for (let i = 0; i < boxes.length; i++) {
        const dd = boxDist(cx, cy, boxes[i]);
        if (dd < d) d = dd;
      }
      return f(f(reach - er) - d);   // > 0 → adentro; el valor es la profundidad
    }

    const field = mode === "knockout"
      ? (o.fieldRect || { x: 0, y: 0, w: o.w, h: o.h })
      : null;
    const notchFringe = o.notchFringe !== undefined ? o.notchFringe : cell * 1.6;

    for (let r = 0; r < rows; r++) {
      const cy = f(f(oy + f(r * cell)) + f(cell / 2));
      for (let c = 0; c < cols; c++) {
        const cx = f(f(ox + f(c * cell)) + f(cell / 2));
        let depth;

        const idx = r * cols + c;
        if (mode === "knockout") {
          /* la masa cubre el campo y se le RESTAN las cajas medidas — es el
             inverso de grow, y es el look del video de referencia: los
             bloques chicos viven en muescas recortadas dentro de la masa */
          depth = occupied(idx, cx, cy, [field], fringe, erode, fd);
          if (depth > 0 && occupied(idx, cx, cy, rects, notchFringe, 0, fdHole) > 0) {
            depth = -1;
          }
        } else {
          depth = occupied(idx, cx, cy, rects, fringe, erode, fd);
        }

        let hit = depth > 0;

        /* dissolve: en una banda del borde hacia adentro, la celda sólo
           sobrevive si supera el umbral ordenado de su posición */
        if (hit && dither > 0) {
          const t = depth / (fringe * dither);
          if (t < 1 && bayer(c, r) > t) hit = false;
        }

        on[idx] = hit ? 1 : 0;
      }
    }

    return { on, cols, rows, cell, ox, oy, w: o.w, h: o.h };
  }

  const at = (g, c, r) =>
    (c < 0 || r < 0 || c >= g.cols || r >= g.rows) ? 0 : g.on[r * g.cols + c];

  /* --- render ------------------------------------------------------------ */

  function render(ctx, g, style) {
    const s = style || {};
    const cell = g.cell;

    if (s.fill) {
      ctx.fillStyle = s.fill;

           segundo color. Del póster zkPass. */

        const d = Math.max(1, cell * k);
        const off = (cell - d) / 2;
        for (let r = 0; r < g.rows; r++) {
          for (let c = 0; c < g.cols; c++) {
            if (!g.on[r * g.cols + c]) continue;
            ctx.fillRect(g.ox + c * cell + off, g.oy + r * cell + off, d, d);
          }
        }
      } else {
        /* +1 tapa la costura entre celdas contiguas */
        for (let r = 0; r < g.rows; r++) {
          for (let c = 0; c < g.cols; c++) {
            if (!g.on[r * g.cols + c]) continue;
            ctx.fillRect(g.ox + c * cell, g.oy + r * cell, cell + 1, cell + 1);
          }
        }
      }
    }

    /* filete: se traza SÓLO sobre los lados que separan una celda encendida
       de una apagada, así el contorno sigue la escalera exacta en vez de
       aproximarla. Es el filete de las fichas del video. */
    if (s.stroke) {
      ctx.strokeStyle = s.stroke;
      ctx.lineWidth = s.strokeWidth || Math.max(1, cell * 0.09);
      ctx.lineCap = "square";
      ctx.beginPath();

          if (!at(g, c, r - 1)) { ctx.moveTo(x, y);               ctx.lineTo(x + cell, y); }
          if (!at(g, c, r + 1)) { ctx.moveTo(x, y + cell);        ctx.lineTo(x + cell, y + cell); }
          if (!at(g, c - 1, r)) { ctx.moveTo(x, y);               ctx.lineTo(x, y + cell); }
          if (!at(g, c + 1, r)) { ctx.moveTo(x + cell, y);        ctx.lineTo(x + cell, y + cell); }
        }

    ctx.beginPath();
    const cell = g.cell;

    const sel = cv.dataset.from || ".inner";
    const cr = cv.getBoundingClientRect();
    const out = [];
    sel.split(",").map((s) => s.trim()).filter(Boolean).forEach((s) => {
      host.querySelectorAll(s).forEach((el) => {
        const er = el.getBoundingClientRect();
        if (!er.width || !er.height) return;
        out.push({
          x: (er.left - cr.left) * d - pad,
          y: (er.top  - cr.top)  * d - pad,
          w: er.width  * d + pad * 2,
          h: er.height * d + pad * 2
        });
      });
    });
    return out;
  }

  function paintBlob(cv) {
    const d = dpr();
    const g2 = cv.getContext("2d");
    sizeFor(cv);
    g2.clearRect(0, 0, cv.width, cv.height);

    const T = root.BienalTokens || {};
    const ACID = T.acid || "#C8F52D";
    const VOID = T.void || "#12140F";
    const QUIET = T.quiet || "#1D2016";

    const cell = (+cv.dataset.cell || 20) * d;
    const fringe = cell * (+cv.dataset.fringeCells || 3.2);
    const seed = +cv.dataset.seed || 0;
    const mode = cv.dataset.mode || "grow";
    const dither = +cv.dataset.dither || 0;
    const pad = cell * 0.5;

    let rects = readRects(cv, d, pad);

    /* bleed: la masa se va del borde en vez de terminar dentro del canvas.
       Ahora las cuatro direcciones, no sólo left/bottom. */
    const bleed = cv.dataset.bleed || "";
    if (mode !== "knockout" && rects.length) {
      const r0 = rects[0];
      if (bleed.includes("left"))   { r0.w += r0.x + fringe; r0.x = -fringe; }
      if (bleed.includes("top"))    { r0.h += r0.y + fringe; r0.y = -fringe; }
      if (bleed.includes("right"))  { r0.w = cv.width  + fringe - r0.x; }
      if (bleed.includes("bottom")) { r0.h = cv.height + fringe - r0.y; }
    }

    let fieldRect = null;
    if (mode === "knockout") {
      const inset = (+cv.dataset.inset || 0) * d;
      fieldRect = { x: inset, y: inset, w: cv.width - inset * 2, h: cv.height - inset * 2 };
    }

    const gr = grid({
      w: cv.width, h: cv.height, cell, fringe, seed, dither, rects, mode, fieldRect,
      notchFringe: cell * (+cv.dataset.notchCells || 1.6)
    });

    /* `data-blob` acepta cuatro cosas: un nombre de token del sistema, "none"
       (sin relleno: sólo queda la retícula en __grid para que otro la use),
       un color literal `#rrggbb`, o el NOMBRE de una custom property —
       `data-blob="--card"` lee `--card` del elemento que contiene al canvas.
       Esa última forma es la que deja que una plancha tome el color de su
       propia ficha sin que el motor tenga que conocer la paleta de §04. */
    const key = cv.dataset.blob;
    const fill =
        key === "none"  ? null
      : key === "void"  ? VOID
      : key === "quiet" ? QUIET
      : key && key.charAt(0) === "#" ? key
      : key && key.slice(0, 2) === "--"
          ? (getComputedStyle(cv.parentElement).getPropertyValue(key).trim() || ACID)
      : ACID;
    const strokeKey = cv.dataset.stroke;
    const stroke = !strokeKey ? null
      : strokeKey === "void" ? VOID : strokeKey === "acid" ? ACID : strokeKey;

    render(g2, gr, {
      fill,
      stroke,
      strokeWidth: cv.dataset.strokeWidth ? +cv.dataset.strokeWidth * d : undefined,
      dots: cv.dataset.fill === "dots" ? (+cv.dataset.dotRatio || 0.34) : false
    });

    cv.__grid = gr;
  }

  /* --- remedición unificada ---------------------------------------------
     Antes: el hero tenía ResizeObserver y la hoja no (una hoja que reflowea
     sin resize de ventana quedaba con máscaras viejas); la hoja tenía
     beforeprint y el hero no; ninguna pausaba fuera de pantalla.          */

  let raf = 0, wired = false;

  function paintAll() {
    document.querySelectorAll("canvas[data-blob]").forEach(paintBlob);
    if (root.BienalSteps) root.BienalSteps();
  }

  function schedule() {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(paintAll);
  }

  function wire() {
    if (wired) return;
    wired = true;
    paintAll();
    window.addEventListener("resize", schedule, { passive: true });
    window.addEventListener("beforeprint", paintAll);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) schedule(); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(schedule);
      document.querySelectorAll("canvas[data-blob]").forEach((cv) => {
        if (cv.parentElement) ro.observe(cv.parentElement);
      });
    }
  }

  root.Mask = {
    hash21, vnoise, fbm, boxDist, bayer, clamp,
    grid, render, clipTo, at,
    paintBlob, paintAll, schedule, wire, sizeFor, dpr
  };

  if (typeof document !== "undefined") {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", wire);
    } else {
      wire();
    }
  }
})(typeof window !== "undefined" ? window : globalThis);

</script>
