<style>
/* layout: one plate, centered, on the Reshore cream; the 60° plate of the brand system */
:root{
  --bg:#F4F3EC; --fg:#221D1D; --muted:#5E5A58; --rule:rgba(34,29,29,.28);
  --red:#EF0F0F; --red-ink:#BF0F0F; --cream:#F4F3EC; --carbon:#221D1D; --field:#FFFFFF;
  --grot:"Space Grotesk","Helvetica Neue",Arial,sans-serif; --mono:"Space Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#221D1D; --fg:#F4F3EC; --muted:#AAA6A1; --rule:rgba(244,243,236,.26); --field:#2E2828; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#221D1D; --fg:#F4F3EC; --muted:#AAA6A1; --rule:rgba(244,243,236,.26); --field:#2E2828; color-scheme:dark; }
*,*::before,*::after{ box-sizing:border-box; border-radius:0; }
html,body{ height:100%; }
body{ margin:0; background:var(--bg); color:var(--fg); font:400 15px/1.5 var(--grot); -webkit-font-smoothing:antialiased; display:grid; place-items:center; padding-block:32px; padding-inline:16px; }
.gate{ width:min(100%,420px); outline:2px solid var(--red); outline-offset:-2px; padding:28px 28px 26px; position:relative; }
.reg{ position:absolute; width:13px; height:13px; pointer-events:none; color:var(--red-ink); background:linear-gradient(currentColor,currentColor) 50% 0/1px 100% no-repeat,linear-gradient(currentColor,currentColor) 0 50%/100% 1px no-repeat; }
.reg.tl{ left:8px; top:8px } .reg.tr{ right:8px; top:8px } .reg.bl{ left:8px; bottom:8px } .reg.br{ right:8px; bottom:8px }
.logo{ width:132px; height:auto; display:block; color:var(--fg); margin-bottom:22px; }
.lbl{ font:700 11px/1.3 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--red-ink); display:flex; align-items:center; gap:10px; margin:0 0 10px; }
.lbl::before{ content:""; width:10px; height:10px; background:var(--red); clip-path:polygon(29% 0,100% 0,71% 50%,100% 100%,29% 100%,0 50%); }
h1{ font:700 clamp(22px,5vw,28px)/1.05 var(--grot); letter-spacing:-.025em; margin:0 0 8px; text-wrap:balance; }
p{ margin:0; color:var(--muted); }
form{ margin-top:20px; display:grid; gap:12px; }
label{ display:block; }
label span{ display:block; font:700 11px/1.3 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--red-ink); margin-bottom:6px; }
input{ width:100%; font:400 16px var(--mono); color:var(--fg); background:var(--field); border:0; outline:2px solid var(--carbon); outline-offset:-2px; padding:11px 12px; }
:root[data-theme="dark"] input, html:not([data-theme="light"]) input{ outline-color:var(--rule); }
input:focus-visible{ outline-color:var(--red); }
.row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
button{ display:inline-flex; align-items:center; gap:.8em; font:700 11px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; height:46px; padding:0 calc(13.3px + 1.1em); border:0; cursor:pointer; background:var(--red); color:var(--cream); clip-path:polygon(13.3px 0,calc(100% - 13.3px) 0,100% 50%,calc(100% - 13.3px) 100%,13.3px 100%,0 50%); }
button::after{ content:""; width:.55em; height:.9em; background:currentColor; clip-path:polygon(0 0,100% 50%,0 100%); }
button:hover{ background:var(--carbon); } button:disabled{ opacity:.55; cursor:default; }
button:focus-visible{ outline:2px solid var(--red); outline-offset:3px; }
.err{ font:700 11px/1.4 var(--mono); letter-spacing:.04em; color:var(--red-ink); min-height:1.4em; }
.foot{ margin-top:22px; padding-top:14px; border-top:1px solid var(--rule); font:400 11px/1.6 var(--mono); color:var(--muted); letter-spacing:.02em; }
@media (prefers-reduced-motion: no-preference){ .gate{ animation:in .35s cubic-bezier(.22,.61,.36,1) both; } @keyframes in{ from{ opacity:0; transform:translateY(8px) } } }

    const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:u8(P.salt), iterations:P.iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:u8(P.iv) }, key, u8(P.ct));
    return new TextDecoder().decode(pt);
  }
  f.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Opening';
    try {
      const html = await open(pw.value);
      document.open(); document.write(html); document.close();
    } catch (x) {
      err.textContent = 'Wrong password. Try again.'; go.disabled = false; go.textContent = 'Open'; pw.select();
    }
  });
  pw.focus();
})();
